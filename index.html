<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Mob Swarm - an ad-free, battery-friendly multiplier mob shooter.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1020">
<title>Mob Swarm</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #0b1020; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #overlay {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    background: rgba(8, 12, 28, 0.78);
  }
  #overlay.show { display: flex; }
  #overlay h1 {
    margin: 0; font-size: 52px; letter-spacing: 1px; color: #fff;
    text-shadow: 0 0 24px #3aa0ff, 0 0 48px #3aa0ff;
    animation: pop .5s cubic-bezier(.2,1.6,.4,1);
  }
  #overlay.lose h1 { text-shadow: 0 0 24px #ff3b4e, 0 0 48px #ff3b4e; }
  #overlay button {
    font: inherit; font-size: 20px; font-weight: 700; color: #fff;
    padding: 14px 40px; border: 0; border-radius: 999px; cursor: pointer;
    background: linear-gradient(180deg, #4db3ff, #1c6fe0);
    box-shadow: 0 6px 0 #124a9c, 0 10px 24px rgba(0,0,0,.5);
  }
  #overlay button:active { transform: translateY(4px); box-shadow: 0 2px 0 #124a9c; }
  #mute {
    position: absolute; top: 8px; right: 10px; z-index: 5;
    width: 36px; height: 36px; padding: 0; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.25); background: rgba(20,30,60,.7);
    color: #fff; font-size: 18px; line-height: 34px; text-align: center; cursor: pointer;
  }
  #mute:active { transform: scale(.92); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="overlay">
      <h1 id="overlayTitle">Victory!</h1>
      <button id="restart" type="button">Next Level</button>
    </div>
    <button id="mute" type="button" aria-label="Mute audio" title="Mute / unmute">&#128266;</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------- Config (logical portrait space) ----------
  var W = 360, H = 640;
  var MAX_MOBS = 1500;           // blue pool capacity
  var MAX_RED = 500;             // red pool capacity
  var MOB_R = 4, RED_R = 7;
  var RED_HP = 2;
  var MOB_SPEED = 250;           // px/s upward (blue)
  var RED_SPEED_BASE = MOB_SPEED * 0.75;   // px/s downward (red); scaled per level
  var FIRE_RATE = 9;             // shots/s
  var SPREAD = 14;               // px/s sideways jitter at fire
  var BASE_Y = 52, BASE_H = 64;  // base rect top / height (HUD lives above)
  var BASE_BOTTOM = BASE_Y + BASE_H;
  var CANNON_Y = H - 56;
  var CANNON_MAX_HP = 5;
  var MAX_DT = 1 / 20;           // clamp huge frame gaps
  var HIT_R2 = (MOB_R + RED_R) * (MOB_R + RED_R);
  var FUNNEL = 0.7;              // 0 = waves from center, 1 = exactly over the blue cluster
  var RED_ATTRACT = 0.8, RED_ATTRACT_MAX = 45;      // red lateral pull toward blue mass
  var BLUE_ATTRACT = 0.5, BLUE_ATTRACT_MAX = 70;    // blue lateral accel toward red mass

  var PLAYING = 0, WON = 1, LOST = 2;

  // ---------- Levels ----------
  // gates: [width, y, type, n, label, startRight, speed]
  var LEVELS = [
    // Siege balance: huge base HP so multiplied swarms must be sustained, not burst.
    // Gate types: 'x' multiply, '+' add, '-' tax (kills up to n blues, recharges), '/' halve (kills every 2nd blue).
    // Negative gates (red) slide opposite to the multiplier gate just below them.
    { baseHP: 1000,  redInterval: 7.0,  waveMin: 8,  waveMax: 12, redSpeedMul: 1.0,
      gates: [[130, 360, 'x', 2, 'x2', false, 60]] },
    { baseHP: 3500,  redInterval: 8.5,  waveMin: 20, waveMax: 25, redSpeedMul: 1.0,
      gates: [[130, 360, 'x', 2, 'x2', false, 80], [110, 280, '+', 5, '+5', true, 100],
              [90, 320, '-', 10, '-10', true, 90]] },
    { baseHP: 10000, redInterval: 10.0, waveMin: 40, waveMax: 50, redSpeedMul: 1.15,
      gates: [[110, 390, 'x', 2, 'x2', false, 190], [90, 310, '+', 5, '+5', true, 230],
              [100, 350, '/', 2, '/2', true, 210], [80, 270, '-', 10, '-10', false, 200]] }
  ];
  var MAX_GATES = 4;
  var NEG_RECHARGE = 0.5;                    // '-' gates regain n * this per second

  // Gate objects are pre-allocated and reconfigured per level. They slide between [min, max] and bounce.
  var GATES = [{}, {}, {}, {}];
  var gateCount = 0;
  function cfgGate(G, d) {
    G.w = d[0]; G.y = d[1]; G.h = 26; G.type = d[2]; G.n = d[3]; G.label = d[4];
    G.startRight = d[5]; G.speed = d[6];
    G.min = 10; G.max = W - 10 - G.w;
    G.x = G.startRight ? G.max : G.min;
    G.vx = G.startRight ? -G.speed : G.speed;
    G.charges = G.n; G.flip = 0;             // state for '-' and '/' gates
  }

  // ---------- Blue mob pool: pre-allocated parallel typed arrays ----------
  var mx = new Float32Array(MAX_MOBS);
  var my = new Float32Array(MAX_MOBS);
  var mvx = new Float32Array(MAX_MOBS);
  var mvy = new Float32Array(MAX_MOBS);
  var mmask = new Uint8Array(MAX_MOBS);   // bit i set => already passed gate i
  var bdead = new Uint8Array(MAX_MOBS);   // marked during collisions, compacted afterwards
  var mobCount = 0;                       // active blue are indices [0, mobCount)

  function spawnMob(x, y, vx, vy, mask) {
    if (mobCount >= MAX_MOBS) return false;     // pool exhausted: drop, never allocate
    var i = mobCount++;
    mx[i] = x; my[i] = y; mvx[i] = vx; mvy[i] = vy; mmask[i] = mask; bdead[i] = 0;
    return true;
  }
  function killMob(i) {                         // swap-remove with last active
    var l = --mobCount;
    if (i !== l) {
      mx[i] = mx[l]; my[i] = my[l]; mvx[i] = mvx[l]; mvy[i] = mvy[l]; mmask[i] = mmask[l]; bdead[i] = 0;
    }
  }

  // ---------- Red mob pool ----------
  var rx = new Float32Array(MAX_RED);
  var ry = new Float32Array(MAX_RED);
  var rvx = new Float32Array(MAX_RED);
  var rdead = new Uint8Array(MAX_RED);
  var rhp = new Uint8Array(MAX_RED);       // red shield: RED_HP blues to destroy one red
  var redCount = 0;
  function spawnRed(x, y) {
    if (redCount >= MAX_RED) return false;
    var i = redCount++;
    rx[i] = x; ry[i] = y; rvx[i] = 0; rdead[i] = 0; rhp[i] = RED_HP;
    return true;
  }

  // ---------- Spatial grid for blue-vs-red (linked lists in typed arrays, zero allocation) ----------
  var CELL = 16, COLS = Math.ceil(W / CELL), ROWS = Math.ceil(H / CELL);
  var gridHead = new Int16Array(COLS * ROWS);
  var gridNext = new Int16Array(MAX_MOBS);
  function cellX(x) { var c = (x / CELL) | 0; return c < 0 ? 0 : (c >= COLS ? COLS - 1 : c); }
  function cellY(y) { var c = (y / CELL) | 0; return c < 0 ? 0 : (c >= ROWS ? ROWS - 1 : c); }

  // ---------- Pop effects: fixed ring buffer ----------
  var POP_MAX = 48;
  var popX = new Float32Array(POP_MAX), popY = new Float32Array(POP_MAX), popLife = new Float32Array(POP_MAX);
  var popHead = 0;
  function spawnPop(x, y) {
    popX[popHead] = x; popY[popHead] = y; popLife[popHead] = 1;
    popHead = (popHead + 1) % POP_MAX;
  }

  // ---------- Audio: Web Audio synthesis, zero assets, lazily created on first gesture ----------
  var AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
  var actx = null, master = null, noiseBuf = null;
  var muted = false;
  try { muted = localStorage.getItem('mobswarm_muted') === '1'; } catch (_) {}
  var clock = 0;                                   // game-time seconds (drives sound throttling)
  var lastGateSfx = -1, lastHitSfx = -1;

  function initAudio() {
    if (!AC) return;
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    try {
      actx = new AC();
      master = actx.createGain();
      master.gain.value = 0.5;
      master.connect(actx.destination);
      var n = (actx.sampleRate * 0.15) | 0;
      noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    } catch (_) { actx = null; }
  }
  function tone(f0, f1, dur, type, vol, delay) {
    if (!actx || muted) return;
    var t = actx.currentTime + (delay || 0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, ftype, freq, vol) {
    if (!actx || muted) return;
    var t = actx.currentTime;
    var s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = noiseBuf;
    f.type = ftype; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur + 0.02);
  }
  function sfxPop()  { noise(0.05, 'lowpass', 700, 0.12); }                       // cannon: soft low-passed pop
  function sfxGate() {                                                           // rising chime
    if (clock - lastGateSfx < 0.06) return; lastGateSfx = clock;
    tone(520, 1040, 0.14, 'triangle', 0.12);
  }
  function sfxHit() {                                                            // muted click/crunch
    if (clock - lastHitSfx < 0.04) return; lastHitSfx = clock;
    noise(0.025, 'bandpass', 1400, 0.07);
  }
  var lastNegSfx = -1;
  function sfxNeg() {                                                            // dissonant buzz (tritone)
    if (clock - lastNegSfx < 0.06) return; lastNegSfx = clock;
    tone(220, 200, 0.13, 'square', 0.07);
    tone(311, 290, 0.13, 'square', 0.07);
  }
  function sfxCannonHit() { tone(160, 60, 0.18, 'sawtooth', 0.15); noise(0.12, 'lowpass', 400, 0.15); }
  function sfxWin()  { var f = [523, 659, 784, 1047]; for (var i = 0; i < 4; i++) tone(f[i], f[i] * 1.01, 0.22, 'triangle', 0.15, i * 0.12); }
  function sfxLose() { var f = [392, 330, 262, 196]; for (var i = 0; i < 4; i++) tone(f[i], f[i] * 0.97, 0.3, 'sawtooth', 0.1, i * 0.18); }

  // ---------- State ----------
  var state = PLAYING;
  var level = 0;
  var baseMaxHP = 1000, baseHP = 1000;
  var cannonHP = CANNON_MAX_HP;
  var redInterval = 7, waveMin = 8, waveMax = 12, redSpeed = RED_SPEED_BASE;
  var cannonX = W / 2, targetX = W / 2;
  var fireAcc = 0, fireCount = 0;
  var redTimer = 1.5;
  var baseHeat = 0, ghostHP = 1000, cannonFlash = 0;   // baseHeat: damage flicker; ghostHP: chip-damage trail
  var gateFlash = new Float32Array(MAX_GATES);
  var blueCX = W / 2, blueN = 0;           // blue centroid from previous frame
  var autoFire = true, spawnerOn = true;   // toggled only by debug hooks

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d', { alpha: false });
  var stage = document.getElementById('stage');
  var overlay = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlayTitle');
  var restartBtn = document.getElementById('restart');
  var muteBtn = document.getElementById('mute');
  var scale = 1;

  function syncMuteBtn() {
    muteBtn.textContent = muted ? '\uD83D\uDD07' : '\uD83D\uDD0A';
    muteBtn.setAttribute('aria-label', muted ? 'Unmute audio' : 'Mute audio');
  }
  muteBtn.addEventListener('click', function () {
    initAudio();
    muted = !muted;
    try { localStorage.setItem('mobswarm_muted', muted ? '1' : '0'); } catch (_) {}
    syncMuteBtn();
  });

  // ---------- Responsive scaling ----------
  function resize() {
    var vw = window.innerWidth, vh = window.innerHeight;
    scale = Math.min(vw / W, vh / H);
    var cw = Math.floor(W * scale), ch = Math.floor(H * scale);
    stage.style.width = cw + 'px';
    stage.style.height = ch + 'px';
    var dpr = Math.min(window.devicePixelRatio || 1, 2);   // cap DPR for battery
    canvas.width = Math.floor(cw * dpr);
    canvas.height = Math.floor(ch * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  // ---------- Input (Pointer Events: touch + mouse) ----------
  function pointerToLogicalX(e) {
    var r = canvas.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width * W;
    return x < 16 ? 16 : (x > W - 16 ? W - 16 : x);
  }
  var dragging = false;
  canvas.addEventListener('pointerdown', function (e) {
    initAudio();
    dragging = true;
    targetX = pointerToLogicalX(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', function (e) {
    if (dragging || e.pointerType === 'mouse') targetX = pointerToLogicalX(e);
    e.preventDefault();
  });
  function endDrag() { dragging = false; }   // firing stops immediately on release
  canvas.addEventListener('lostpointercapture', endDrag);
  window.addEventListener('blur', endDrag);
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ---------- Game logic ----------
  // Loads the current `level` and restarts it.
  function reset() {
    var L = LEVELS[level];
    mobCount = 0; redCount = 0;
    baseMaxHP = L.baseHP; baseHP = baseMaxHP;
    cannonHP = CANNON_MAX_HP;
    redInterval = L.redInterval; waveMin = L.waveMin; waveMax = L.waveMax; redSpeed = RED_SPEED_BASE * L.redSpeedMul;
    state = PLAYING;
    fireAcc = 0; fireCount = 0;
    redTimer = 3;                      // grace period before the first wall
    baseHeat = 0; ghostHP = baseHP; cannonFlash = 0;
    blueCX = W / 2; blueN = 0;
    for (var p = 0; p < POP_MAX; p++) popLife[p] = 0;
    gateCount = L.gates.length;
    for (var g = 0; g < MAX_GATES; g++) {
      gateFlash[g] = 0;
      if (g < gateCount) cfgGate(GATES[g], L.gates[g]);
    }
    overlay.classList.remove('show', 'lose');
  }

  function endGame(newState) {
    state = newState;
    mobCount = 0; redCount = 0;
    var won = newState === WON;
    overlayTitle.textContent = won ? 'Victory!' : 'Defeat';
    restartBtn.textContent = won ? (level < LEVELS.length - 1 ? 'Next Level' : 'Victory - Play Again') : 'Try Again';
    overlay.classList.toggle('lose', !won);
    overlay.classList.add('show');
    if (won) sfxWin(); else sfxLose();
  }

  // Button: Next Level after a win (wraps to level 1 after the last), same level after a defeat.
  function onRestart() {
    initAudio();
    if (state === WON) level = (level + 1) % LEVELS.length;
    reset();
  }
  restartBtn.addEventListener('click', onRestart);
  restartBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });

  // Spawn clones for gate `gi` triggered by blue mob `mobIdx` at (x, y).
  function applyGate(mobIdx, gi, x, y) {
    var gate = GATES[gi];
    var extra = gate.type === 'x' ? gate.n - 1 : gate.n;
    var mask = (1 << gi) | mmask[mobIdx];   // clones inherit every gate the parent has passed
    gateFlash[gi] = 1;
    sfxGate();
    for (var k = 0; k < extra; k++) {
      var dir = (k & 1) ? 1 : -1;           // alternate outward scatter
      var vx = dir * (30 + Math.random() * 70);
      var vy = -MOB_SPEED * (0.85 + Math.random() * 0.2);
      if (!spawnMob(x + dir * 3, y - 2 - Math.random() * 6, vx, vy, mask)) break;
    }
  }

  // Red wave: a dense wall (staggered rows, ~2:1 aspect), centered between the map center
  // and the blue cluster (funneling), emerging from the base all at once.
  var WALL_STEP = 16;                       // > red diameter (14): no overlap
  function spawnWave() {
    var n = waveMin + ((Math.random() * (waveMax - waveMin + 1)) | 0);
    var cols = Math.min(12, Math.ceil(Math.sqrt(n * 2)));
    var halfW = (cols - 1) * WALL_STEP * 0.5 + WALL_STEP * 0.25;
    var center = blueN > 0 ? W / 2 + (blueCX - W / 2) * FUNNEL : W / 2;
    var lo = halfW + RED_R + 4, hi = W - halfW - RED_R - 4;
    center = center < lo ? lo : (center > hi ? hi : center);
    for (var k = 0; k < n; k++) {
      var row = (k / cols) | 0, col = k - row * cols;
      var x = center + (col - (cols - 1) * 0.5) * WALL_STEP + ((row & 1) ? WALL_STEP * 0.25 : -WALL_STEP * 0.25) + (Math.random() - 0.5) * 2;
      var y = BASE_BOTTOM + RED_R + 1 + row * WALL_STEP;
      if (!spawnRed(x, y)) break;
    }
  }

  function update(dt) {
    if (state !== PLAYING) return;
    var i, gi;
    clock += dt;

    // Gates slide and bounce
    for (gi = 0; gi < gateCount; gi++) {
      var G = GATES[gi];
      G.x += G.vx * dt;
      if (G.x < G.min) { G.x = G.min; G.vx = Math.abs(G.vx); }
      else if (G.x > G.max) { G.x = G.max; G.vx = -Math.abs(G.vx); }
      if (G.type === '-' && G.charges < G.n) {
        G.charges += G.n * NEG_RECHARGE * dt;
        if (G.charges > G.n) G.charges = G.n;
      }
    }

    // Cannon eases toward target; fires ONLY while the player is touching/dragging.
    // The cooldown charges (max 1 shot) while idle, so a tap fires at once but tapping can't beat FIRE_RATE.
    cannonX += (targetX - cannonX) * Math.min(1, dt * 18);
    fireAcc += dt * FIRE_RATE;
    if (dragging && autoFire) {
      while (fireAcc >= 1) {
        fireAcc -= 1;
        if ((fireCount++ % 3) === 0) sfxPop();       // every 3rd shot to keep audio light
        spawnMob(cannonX, CANNON_Y - 18, (Math.random() - 0.5) * 2 * SPREAD, -MOB_SPEED, 0);
      }
    } else if (fireAcc > 1) {
      fireAcc = 1;
    }

    // Opponent spawner
    if (spawnerOn) {
      redTimer -= dt;
      if (redTimer <= 0) {
        redTimer = redInterval * (0.7 + Math.random() * 0.6);
        spawnWave();
      }
    }

    // Red centroid (for blue attraction)
    var redCX = W / 2;
    if (redCount > 0) {
      var rs = 0;
      for (i = 0; i < redCount; i++) rs += rx[i];
      redCX = rs / redCount;
    }

    // Blue mobs: iterate with live mobCount (clones appended mid-loop carry inherited gate bits)
    var bSum = 0, bN = 0;
    i = 0;
    while (i < mobCount) {
      var x = mx[i] + mvx[i] * dt;
      var y = my[i] + mvy[i] * dt;
      var vx = mvx[i];
      var vy = mvy[i];

      // Lateral pull toward the red mass once clear of the cannon
      if (redCount > 0 && y < CANNON_Y - 80) {
        var a = (redCX - x) * BLUE_ATTRACT;
        vx += (a > BLUE_ATTRACT_MAX ? BLUE_ATTRACT_MAX : (a < -BLUE_ATTRACT_MAX ? -BLUE_ATTRACT_MAX : a)) * dt;
      }
      if (x < MOB_R) { x = MOB_R; vx = -vx; }
      else if (x > W - MOB_R) { x = W - MOB_R; vx = -vx; }
      vx *= (1 - Math.min(1, dt * 2.5));     // scatter bleeds off
      mvx[i] = vx; mx[i] = x; my[i] = y;
      bSum += x; bN++;

      // Gates: circle-vs-rect overlap while moving up; each gate fires at most once per mob
      if (vy < 0) {
        var m = mmask[i];
        var gateKilled = false;
        for (gi = 0; gi < gateCount; gi++) {
          var bit = 1 << gi;
          if (m & bit) continue;
          var gt = GATES[gi], hh = gt.h * 0.5;
          if (x + MOB_R >= gt.x && x - MOB_R <= gt.x + gt.w &&
              y + MOB_R >= gt.y - hh && y - MOB_R <= gt.y + hh) {
            mmask[i] = (m |= bit);
            if (gt.type === '-') {            // tax: destroys the mob while charges remain
              if (gt.charges >= 1) { gt.charges -= 1; gateFlash[gi] = 1; sfxNeg(); gateKilled = true; break; }
            } else if (gt.type === '/') {     // halve: every 2nd mob is destroyed
              gt.flip ^= 1;
              if (gt.flip) { gateFlash[gi] = 1; sfxNeg(); gateKilled = true; break; }
            } else {
              applyGate(i, gi, x, y);
            }
          }
        }
        if (gateKilled) { killMob(i); continue; }
      }

      // Opponent base
      if (y <= BASE_BOTTOM) {
        if (x >= 10 && x <= W - 10) {
          baseHP--; baseHeat = baseHeat < 1 ? baseHeat + 0.12 : 1;
          killMob(i);
          if (baseHP <= 0) { baseHP = 0; endGame(WON); return; }
          continue;
        }
        if (y < -10) { killMob(i); continue; }
      }
      i++;
    }
    blueN = bN;
    blueCX = bN > 0 ? bSum / bN : W / 2;

    // Red mobs march down. The whole red mass drifts toward the blue mass as one body
    // (shared velocity from the centroid offset) so walls keep their shape instead of collapsing to a column.
    var rdy = redSpeed * dt;
    var v = 0;
    if (blueN > 0 && redCount > 0) {
      v = (blueCX - redCX) * RED_ATTRACT;
      v = v > RED_ATTRACT_MAX ? RED_ATTRACT_MAX : (v < -RED_ATTRACT_MAX ? -RED_ATTRACT_MAX : v);
    }
    for (i = 0; i < redCount; i++) {
      rvx[i] = v;
      var nx = rx[i] + v * dt;
      rx[i] = nx < RED_R ? RED_R : (nx > W - RED_R ? W - RED_R : nx);
      ry[i] += rdy;
    }

    // Blue-vs-red: bucket blues in the grid, each red tests its 3x3 neighbourhood.
    // Kills are only flagged here; compaction happens after, so grid indices stay valid.
    if (redCount > 0 && mobCount > 0) {
      var c;
      for (c = 0; c < gridHead.length; c++) gridHead[c] = -1;
      for (i = 0; i < mobCount; i++) {
        c = cellY(my[i]) * COLS + cellX(mx[i]);
        gridNext[i] = gridHead[c];
        gridHead[c] = i;
      }
      var killedBlue = 0, killedRed = 0;
      for (var r = 0; r < redCount; r++) {
        var cx = cellX(rx[r]), cy = cellY(ry[r]);
        var x0 = cx > 0 ? cx - 1 : 0, x1 = cx < COLS - 1 ? cx + 1 : COLS - 1;
        var y0 = cy > 0 ? cy - 1 : 0, y1 = cy < ROWS - 1 ? cy + 1 : ROWS - 1;
        search:
        for (var yy = y0; yy <= y1; yy++) {
          for (var xx = x0; xx <= x1; xx++) {
            for (var b = gridHead[yy * COLS + xx]; b !== -1; b = gridNext[b]) {
              if (bdead[b]) continue;
              var dx = mx[b] - rx[r], dy = my[b] - ry[r];
              if (dx * dx + dy * dy <= HIT_R2) {
                bdead[b] = 1; killedBlue++;
                if (--rhp[r] === 0) { rdead[r] = 1; killedRed++; }   // first hit only wounds (orange)
                spawnPop((mx[b] + rx[r]) * 0.5, (my[b] + ry[r]) * 0.5);
                sfxHit();
                break search;
              }
            }
          }
        }
      }
      if (killedBlue) {                      // compact blue pool
        var w = 0;
        for (i = 0; i < mobCount; i++) {
          if (bdead[i]) continue;
          if (w !== i) { mx[w] = mx[i]; my[w] = my[i]; mvx[w] = mvx[i]; mvy[w] = mvy[i]; mmask[w] = mmask[i]; }
          bdead[w] = 0;
          w++;
        }
        mobCount = w;
      }
      if (killedRed) {                       // compact red pool
        var wr = 0;
        for (i = 0; i < redCount; i++) {
          if (rdead[i]) continue;
          if (wr !== i) { rx[wr] = rx[i]; ry[wr] = ry[i]; rvx[wr] = rvx[i]; rhp[wr] = rhp[i]; }
          rdead[wr] = 0;
          wr++;
        }
        redCount = wr;
      }
    }

    // Reds crossing the cannon line each deal 1 damage and are recycled
    var hits = 0;
    i = 0;
    while (i < redCount) {
      if (ry[i] >= CANNON_Y) {
        spawnPop(rx[i], CANNON_Y);
        var l = --redCount;
        if (i !== l) { rx[i] = rx[l]; ry[i] = ry[l]; rvx[i] = rvx[l]; rhp[i] = rhp[l]; }
        rdead[i] = 0;
        hits++;
      } else i++;
    }
    if (hits) {
      cannonHP -= hits; cannonFlash = 1;
      sfxCannonHit();
      if (cannonHP <= 0) { cannonHP = 0; endGame(LOST); return; }
    }

    // Effects decay
    if (baseHeat > 0) baseHeat = Math.max(0, baseHeat - dt * 3);
    if (ghostHP > baseHP) ghostHP += (baseHP - ghostHP) * Math.min(1, dt * 2.5);
    if (cannonFlash > 0) cannonFlash = Math.max(0, cannonFlash - dt * 3);
    for (gi = 0; gi < gateCount; gi++) if (gateFlash[gi] > 0) gateFlash[gi] = Math.max(0, gateFlash[gi] - dt * 4);
    for (i = 0; i < POP_MAX; i++) if (popLife[i] > 0) popLife[i] -= dt * 4;
  }

  // ---------- Rendering ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function fmt(n) { return n >= 1000 ? ((n / 1000) | 0) + ',' + ('00' + (n % 1000)).slice(-3) : '' + n; }

  function render() {
    // Background
    ctx.fillStyle = '#0b1020';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#121a35';
    ctx.fillRect(10, BASE_BOTTOM, W - 20, H - BASE_BOTTOM);

    // HUD: level
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '800 16px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('LEVEL ' + (level + 1) + '/' + LEVELS.length, 14, 26);

    // Danger line at the cannon
    ctx.strokeStyle = 'rgba(255,70,90,0.35)';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(10, CANNON_Y); ctx.lineTo(W - 10, CANNON_Y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Opponent base
    // Damage flicker: strobes and shakes in proportion to the recent hit rate
    var heatMix = baseHeat * (0.5 + 0.5 * Math.sin(clock * 55));
    var shake = Math.sin(clock * 90) * baseHeat * 2;
    ctx.fillStyle = 'rgb(' + ((216 + 39 * heatMix) | 0) + ',' + ((58 + 80 * heatMix) | 0) + ',' + ((74 + 64 * heatMix) | 0) + ')';
    roundRect(10 + shake, BASE_Y, W - 20, BASE_H, 14);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '700 28px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(fmt(baseHP) + ' HP', W / 2 + shake, BASE_Y + BASE_H / 2 - 6);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(30, BASE_Y + BASE_H - 14, W - 60, 6);
    ctx.fillStyle = '#ffe27a';                       // chip-damage trail
    ctx.fillRect(30, BASE_Y + BASE_H - 14, (W - 60) * (ghostHP / baseMaxHP), 6);
    ctx.fillStyle = '#7dff9a';
    ctx.fillRect(30, BASE_Y + BASE_H - 14, (W - 60) * (baseHP / baseMaxHP), 6);

    // Gates
    ctx.font = '800 22px system-ui, sans-serif';
    for (var gi = 0; gi < gateCount; gi++) {
      var g = GATES[gi], f = gateFlash[gi];
      var isMul = g.type === 'x', isNeg = g.type === '-' || g.type === '/';
      ctx.fillStyle = isNeg ? 'rgba(255,70,90,' + (0.35 + f * 0.4) + ')'
                    : isMul ? 'rgba(60,160,255,' + (0.35 + f * 0.4) + ')' : 'rgba(90,230,140,' + (0.35 + f * 0.4) + ')';
      roundRect(g.x, g.y - g.h / 2, g.w, g.h, 8);
      ctx.fill();
      ctx.strokeStyle = isNeg ? '#ff4d5e' : isMul ? '#4db3ff' : '#6dffa6';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.fillText(g.label, g.x + g.w / 2, g.y + 1);
      if (g.type === '-') {                          // remaining tax charges
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillRect(g.x + 8, g.y + g.h / 2 - 4, (g.w - 16) * (g.charges / g.n), 2);
      }
    }

    // Blue mobs: one batched path, one fill
    var i;
    ctx.fillStyle = '#4db3ff';
    ctx.beginPath();
    for (i = 0; i < mobCount; i++) {
      ctx.moveTo(mx[i] + MOB_R, my[i]);
      ctx.arc(mx[i], my[i], MOB_R, 0, 6.2832);
    }
    ctx.fill();

    // Red mobs: two batches (full health red, wounded orange)
    for (var pass = 2; pass >= 1; pass--) {
      ctx.fillStyle = pass === 2 ? '#ff4d5e' : '#ff9a3c';
      ctx.beginPath();
      for (i = 0; i < redCount; i++) {
        if (rhp[i] !== pass) continue;
        ctx.moveTo(rx[i] + RED_R, ry[i]);
        ctx.arc(rx[i], ry[i], RED_R, 0, 6.2832);
      }
      ctx.fill();
    }

    // Collision pops
    ctx.lineWidth = 2;
    for (i = 0; i < POP_MAX; i++) {
      var life = popLife[i];
      if (life <= 0) continue;
      ctx.strokeStyle = 'rgba(255,255,255,' + life.toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(popX[i], popY[i], 4 + (1 - life) * 16, 0, 6.2832);
      ctx.stroke();
    }

    // Cannon (flashes red when hit)
    ctx.fillStyle = cannonFlash > 0 ? '#ff6a78' : '#2b3a6b';
    roundRect(cannonX - 9, CANNON_Y - 26, 18, 30, 5);
    ctx.fill();
    ctx.fillStyle = cannonFlash > 0 ? '#ff4d5e' : '#4db3ff';
    ctx.beginPath();
    ctx.arc(cannonX, CANNON_Y + 6, 20, 0, 6.2832);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cannonX, CANNON_Y + 6, 7, 0, 6.2832);
    ctx.fill();

    // Cannon HP pips under the cannon
    var px0 = cannonX < 36 ? 36 : (cannonX > W - 36 ? W - 36 : cannonX);
    px0 -= (CANNON_MAX_HP - 1) * 6;
    for (i = 0; i < CANNON_MAX_HP; i++) {
      ctx.fillStyle = i < cannonHP ? '#ff6a78' : 'rgba(255,255,255,0.15)';
      ctx.beginPath();
      ctx.arc(px0 + i * 12, H - 9, 4, 0, 6.2832);
      ctx.fill();
    }

    // Screen flash when the cannon is hit
    if (cannonFlash > 0) {
      ctx.fillStyle = 'rgba(255,40,60,' + (cannonFlash * 0.28).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- Main loop ----------
  var last = 0;
  function frame(t) {
    var dt = (t - last) / 1000;
    last = t;
    if (dt > MAX_DT) dt = MAX_DT;
    if (dt > 0) update(dt);
    render();
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', function () { last = performance.now(); });

  // Debug/test hooks: only exposed at index.html#debug
  if (typeof location !== 'undefined' && location.hash === '#debug') {
    window.__mob = {
      update: update, reset: reset, gates: GATES, restart: onRestart,
      setLevel: function (n) { level = n; reset(); },
      get: function () {
        return { mobCount: mobCount, redCount: redCount, baseHP: baseHP, cannonHP: cannonHP, state: state,
                 level: level, gateCount: gateCount, capBlue: MAX_MOBS, capRed: MAX_RED,
                 redX: Array.prototype.slice.call(rx, 0, redCount), redHP: Array.prototype.slice.call(rhp, 0, redCount), blueX: Array.prototype.slice.call(mx, 0, mobCount) };
      },
      aim: function (x) { targetX = x; cannonX = x; },
      setBaseHP: function (n) { baseHP = n; ghostHP = n; },
      touch: function (b) { dragging = !!b; },
      spawnBlue: function (x, y, vx, vy, mask) { return spawnMob(x, y, vx, vy, mask || 0); },
      spawnRed: spawnRed,
      setFlags: function (f) { if ('fire' in f) autoFire = f.fire; if ('spawner' in f) spawnerOn = f.spawner; }
    };
  }

  syncMuteBtn();
  resize();
  reset();
  requestAnimationFrame(function (t) { last = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
