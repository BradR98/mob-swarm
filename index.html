<script id="sw-register">
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    var hadController = !!navigator.serviceWorker.controller, reloading = false;
    // New worker took control -> reload once so the player always runs the latest build
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController || reloading) return;   // first install: nothing stale to replace
      reloading = true; location.reload();
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
        function activate(w) { if (w) w.postMessage('SKIP_WAITING'); }
        activate(reg.waiting);
        reg.addEventListener('updatefound', function () {
          var w = reg.installing;
          if (w) w.addEventListener('statechange', function () { if (w.state === 'installed' && navigator.serviceWorker.controller) activate(w); });
        });
        reg.update();
        document.addEventListener('visibilitychange', function () { if (!document.hidden) reg.update(); });
      }).catch(function () {});
    });
  }
</script>
<title>Mob Swarm</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;

  }

  #stage { position: relative; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #tilt { position: absolute; left: 0; transform-origin: 50% 100%; pointer-events: none; will-change: transform;
          -webkit-mask-image: linear-gradient(to top, #000 82%, transparent 100%); mask-image: linear-gradient(to top, #000 82%, transparent 100%); }

  #hud { position: absolute; left: 0; top: 0; }

    background: rgba(8, 12, 28, 0.78);

  #overlay.show { display: flex; }

    margin: 0; font-size: 52px; letter-spacing: 1px; color: #fff;

  #overlay button {
    font: inherit; font-size: 20px; font-weight: 700; color: #fff;
    padding: 14px 40px; border: 0; border-radius: 999px; cursor: pointer;
    background: linear-gradient(180deg, #4db3ff, #1c6fe0);

  #overlay button:active { transform: translateY(4px); box-shadow: 0 2px 0 #124a9c; }
  #warpRow { display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,.75); font-size: 14px; }
  #warpRow input { width: 72px; font: inherit; font-size: 18px; padding: 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,.3); background: rgba(20,30,60,.85); color: #fff; text-align: center; }
  #overlay #warp { font-size: 16px; padding: 9px 20px; box-shadow: 0 4px 0 #124a9c; }
  #mute {
    position: absolute; top: 8px; right: 10px; z-index: 5;
    width: 36px; height: 36px; padding: 0; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.25); background: rgba(20,30,60,.7);
    color: #fff; font-size: 18px; line-height: 34px; text-align: center; cursor: pointer;
  }

    position: absolute; top: 8px; right: 54px; z-index: 5;

  }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

<script>
(function () {
  'use strict';

  // ---------- Config (logical portrait space) ----------
  var W = 360, H = 640;
  var MAX_MOBS = 1500;           // blue pool capacity
  var MAX_RED = 1000;            // red pool capacity
  var ES = 0.82;                 // global entity scale ("zoom out"): every entity is drawn/collided ~18% smaller
  var MOB_R = 4 * ES, RED_R = 7 * ES;

  // ---------- The Armory: player cannon stats ----------
  //   fireRate: ms between shots; bulletVelocity: px/s upward; piercing: red HP one blue can subtract before dying
  var Armory = {
    standard: { name: 'Standard', fireRate: 45,  bulletVelocity: 250, piercing: 2, pellets: 1, spreadVx: 0, spread: 110 },   // Phase 16 "lawnmower": 20 shots/s, each blue cleaves 3 red HP
    piercer:  { name: 'Piercer',  fireRate: 111, bulletVelocity: 250, piercing: 2, pellets: 1, spreadVx: 0 },
    rapid:    { name: 'Rapid',    fireRate: 80,  bulletVelocity: 280, piercing: 1, pellets: 1, spreadVx: 0 },
    // Supply-crate power-ups (temporary, POWER_TIME seconds). pellets/spreadVx: shots per trigger / sideways px/s between them
    shotgun:  { name: 'Shotgun',  fireRate: 111, bulletVelocity: 250, piercing: 1, pellets: 3, spreadVx: 85 },
    piercingRounds: { name: 'Piercing Rounds', fireRate: 111, bulletVelocity: 250, piercing: 3, pellets: 1, spreadVx: 0 }
  };
  var POWER_NAMES = ['shotgun', 'piercingRounds'];
  var weapon = Armory.standard, baseWeaponName = 'standard';
  var MOB_SPEED = weapon.bulletVelocity;      // px/s upward (blue); follows the equipped weapon
  var FIRE_RATE = 1000 / weapon.fireRate;     // shots/s
  function setWeapon(w) { weapon = w; MOB_SPEED = w.bulletVelocity; FIRE_RATE = 1000 / w.fireRate; }
  function equip(name) { baseWeaponName = Armory[name] ? name : 'standard'; if (!(powerLeft > 0)) setWeapon(Armory[baseWeaponName]); }

  // ---------- The Bestiary: red mob dictionary ----------
  //   speed / radius are multipliers of the base red; hp in blue-damage points
  var RED_SPEED_BASE = 122;       // px/s downward (red); scaled per tier. Funnel tuning: -35% (was 187.5)
  var RED_SPEED_CAP = 260;        // hard cap (raised from 182 so the per-level speed ramp has headroom; was 280 originally)
  var RED_SPEED_PER_LEVEL = 6;    // funnel tuning: +6 px/s of descent per level on top of the slowed base on any red's descent speed: late game scales density and shields, never speed
  var RedMobTypes = {
    Basic:    { id: 0, speed: 1.0, radius: 1.0, hp: 1, color: '#ff4d5e', wound: '#ff9a3c' },
    Tank:     { id: 1, speed: 0.5, radius: 1.5, hp: 3, color: '#8a1020', wound: '#c8404f' },
    Sprinter: { id: 2, speed: 1.5, radius: 0.7, hp: 1, color: '#ff8a00', wound: '#ffb84d' }
  };
  var RT_LIST = [RedMobTypes.Basic, RedMobTypes.Tank, RedMobTypes.Sprinter];
  var RT_SPEED = new Float32Array(3), RT_RAD = new Float32Array(3), RT_HP = new Uint8Array(3), RT_HIT2 = new Float32Array(3);
  for (var rti = 0; rti < 3; rti++) {
    RT_SPEED[rti] = RT_LIST[rti].speed; RT_RAD[rti] = RT_LIST[rti].radius * RED_R; RT_HP[rti] = RT_LIST[rti].hp;
    RT_HIT2[rti] = (MOB_R + RT_RAD[rti]) * (MOB_R + RT_RAD[rti]);
  }
  var SPREAD = 14;               // px/s sideways jitter at fire
  var BASE_Y = 52, BASE_H = 64;  // base rect top / height (HUD lives above)
  var BASE_BOTTOM = BASE_Y + BASE_H;
  var TRACK_H = H * 0.15, TRACK_Y = H - TRACK_H;   // bottom 15% is the Trackpad Zone: no entity may spawn, enter or render here
  var CANNON_Y = TRACK_Y;        // the cannon line sits exactly on the border above the trackpad zone
  var MUZZLE_OFF = 40;           // shots leave this far above the cannon line (top of the crescent barrel)
  var GATE_H = 26 * ES;
  var CANNON_MAX_HP = 5;
  var MAX_DT = 1 / 20;           // clamp huge frame gaps
  var FUNNEL = 0.7;              // 0 = waves from center, 1 = exactly over the blue cluster
  var RED_GRAV = 1100, RED_ITERS = 3, RED_SOFT = 0.2;               // Phase 13: reds fall under gravity (to a terminal speed) and are solved as a physical pile
  var BLUE_ATTRACT = 0, BLUE_ATTRACT_MAX = 70;    // blue lateral accel toward red mass

  var MAX_LEVEL = 100;           // HUD denominator; generator keeps working beyond it
  var MAX_GATES = 6;             // bits 0-5 of the mob gate mask (bit 7 = "bumped/sucked" flag)
  var MAX_BUMPERS = 8, MAX_HOLES = 4;
  var MAX_WAVE = 300;            // hard cap on red wall size (two walls always fit the 1000 pool)
  var NEG_RECHARGE = 0.5;        // '-' gates regain n * this per second
  var BOSS_W = W * 0.4 * ES, BOSS_H = 56 * ES, BOSS_STRAFE = 22;   // mothership: 40% of screen width, slow drift (px/s)
  var SHOTS_PER_SEC = 20;                 // must match FIRE_RATE; used by the HP formulas
  var POUR_N = 500, POUR_RATE = 45, ATTRITION = 0.02, BASE_HIT = 15, POUR_BASE_HP = 250, POUR_GATE_HP = 0.6, POUR_COL_EASE = 0.3, POUR_MAX_LEVEL = 8, POUR_SPEED0 = 0.4, POUR_REFILL = 60;   // Phase 16: Tier 1 (L1-8) is one sustained pour of reds
  var HP_SCALE = 1 / 3;                   // Phase 18: whole HP curve shifted down (L1 base = 250); every base / boss HP keeps its old progression x HP_SCALE
  var BASE_TTK = 35, BOSS_TTK = 45;       // target perfect-stream seconds to clear
  var HP_PER_TIER = 0.02;                 // +2% base HP per tier
  var MTM_EFF = 1.05, MTM_EFF_EXP = 0.3;                    // measured share of the theoretical multiplier a real stream achieves
  var OBST_BUMPER_EFF = 0.92, OBST_HOLE_EFF = 0.85;   // throughput kept per bumper / black hole (measured)
  var POOL_RATE_CAP = 250;                // blue hits/s the 1500-mob pool can sustain (lifetime ~1.8s, with headroom)
  var TIER_SIZE = 5;
  var TERRAIN_EFF = 0.93;                 // throughput kept per terrain piece (measured)
  var BASE_HP_SCALE = 0.5;                // TTK baseline: the 1x starter cannon now clears the HQ as fast as the 2x did (L1 base 250 -> 125)
  var MOUTH_HALF = 44;                    // spawn mouth half-width cap (was 24): a wider mouth restores the throughput that back-pressure costs
  var BARR_RUNWAY = 140;                  // min free height between the spawn mouth and a barricade top
  var SPAWN_DENSITY = 1.0, DENSITY_STEP = 1.5, DENSITY_STEP_LEVEL = 3, levelDensity = 1;
  function densityFor(n) { var m = effLevel(n), lo = Math.floor(m), f = m - lo, a = densityTier(lo); return f ? a + (densityTier(lo + 1) - a) * f : a; }   // continuous through the L5 -> L9 ramp (L9 = 2.2x)
  function densityTier(n) { return n >= 10 ? 3.5 : (n >= 6 ? 2.2 : (n >= 4 ? 1.8 : (n >= 3 ? 1.5 : 1))); }   // tiers on the remapped level: L1-2 1.0x, L3 1.5x, L4-5 1.8x, L6+ 2.2x, L10+ 3.5x
  // density step: L1-3 run at 1.0x; every level above 3 spawns 1.5x (wave interval / 1.5; pipe and pour rates x1.5)
  var MAX_TERRAIN = 12, SLIDE_MIN = 70, RED_SLIDE = 90;   // min tangential slide speed so mobs never stall on a flat face
  var SPAWN_JITTER = 5, SANDBOX_LEVEL = 99, SANDBOX_RATE = 30, SANDBOX_W = 320;   // Phase 15 physics sandbox (L99)
  var PIPE_RATE = 28 * SPAWN_DENSITY;                     // reds/s leaving the pipe (spacing ~ 1 body at base speed)
  var CRATE_R = 16 * ES, CRATE_HP = 30, CRATE_SPEED = 16, CRATE_MIN = 15, CRATE_MAX = 20;   // supply crate
  var PILL_MAX = 4, PILL_SPEED = 100, POWER_TIME = 8, PILL_R = 10 * ES;
  var BOSS_WAVE_K = 0.4, BOSS_INT_K = 2;
  var BOSS_PIPE_RATE = 14;                // the mothership drips reds out more slowly than a level pipe
  var HOLE_R = 80 * ES, HOLE_CORE = 10 * ES, HOLE_G = 480;    // black hole pull radius / kill radius / pull accel
  var FLAG_BUMPED = 128;

  var PLAYING = 0, WON = 1, LOST = 2;

  // ---------- Procedural level generator ----------
  // Seeded PRNG: level N always generates the same board.
  function rng32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clampN(v, a, b) { return v < a ? a : (v > b ? b : v); }

  var FIELD_TOP = 128, LANE_BOTTOM = 494;                      // terrain lives between the base and the muzzle (shots spawn at 504)
  var GATE_SLOTS = [354, 316, 278, 240];                       // gate rows inside a column, bottom to top (38px apart)
  // ---------- Single chute geometry (was: discrete columns with dividers and trapdoors) ----------
  // SINGLE CHUTE: the board is exactly ONE vertical pipe (no lanes, dividers, doors or lateral spill). The rest of the canvas is dead space.
  var CHUTE_W = 96, MAX_COLS = 1;
  var COL_W = [0, CHUTE_W];
  function columnCount(n) { return 1; }
  function colSpan(nc, c) {                                     // [x0, x1] of column c when nc columns are active (centred)
    var cw = COL_W[nc], x0 = (W - cw) / 2;
    return [x0, x0 + cw];
  }
  var colN = 1, colX0 = new Float32Array(MAX_COLS), colX1 = new Float32Array(MAX_COLS), AX0 = 0, AX1 = W;
  function setColumns(nc) {
    colN = nc;
    for (var c = 0; c < nc; c++) { var sp = colSpan(nc, c); colX0[c] = sp[0]; colX1[c] = sp[1]; }
    AX0 = colX0[0]; AX1 = colX1[nc - 1];
  }
  function colOf(x) {                                           // nearest column (entities always live inside one)
    var best = 0, bd = 1e9;
    for (var c = 0; c < colN; c++) { var d = x - (colX0[c] + colX1[c]) * 0.5; if (d < 0) d = -d; if (d < bd) { bd = d; best = c; } }
    return best;
  }            // y centers, bottom to top (38px apart, never overlap)
  // Dynamic RNG gate drops (replaces the static pools: L3 = x2, +2 / high = x3, +10). Each gate rolls its value inside a window whose floor and
  // ceiling both rise with the level (L4: x2-x4, L7: x3-x6, L10: x4-x8). 'L' gates (wide, low) favour the bottom of the window, 'H' gates (narrow,
  // high) the top. Values are "messy" fractions (x2.2, +1.5); applyGate rounds them probabilistically so the AVERAGE clone count is exact.
  // Crushed gate ceiling: the single chute can't take big multipliers. x windows by level (linear between anchors, clamped): L4 x1.2-1.8, L7 x1.5-2.4, L10+ x2.0-3.0.
  // Live-tuning config (driven by the #debug-harness panel). Initial values mirror the Level 6 math; reset() re-syncs them to every level that loads.
  var TUNING = window.TUNING = { chuteWidth: 84, mobDensity: 2.2, mobSpeed: 140, mobRedHP: 1, gateConcurrency: 2, gateXRange: 1.8, playerDmg: 1.0, playerBullets: 1 };
  var tunApply = false;      // true only while the harness "Restart Level" button rebuilds the level: level-specific TUNING values then override the level math
  var tunGateConc = 99;      // max active gates (captured at level start)
  var GATE_WIN = [[4, 1.2, 1.8], [7, 1.5, 2.4], [10, 2.0, 3.0]];
  function gateWin(n) {
    var w = gateWinBase(n);
    if (tunApply) { var tr = TUNING.gateXRange / w[1]; return [Math.max(1.1, w[0] * tr), TUNING.gateXRange]; }   // harness: ceiling = slider, floor keeps the level's proportion
    return w;
  }
  // LEVEL 9 RESHAPE: the old Level 6 tuning (user-vetted via the harness) now lives at Level 9. Levels 1-5 are untouched, 6-8 ramp from L5 to the new L9,
  // and every level past 9 continues the old curve three levels later (L10 plays like old L7, L13 like old L10). `effLevel` is that remap.
  var L9_CHUTE = 84, L9_GATE_K = 1.8 / 2.2;   // L9 chute width; L9 gate ceiling x1.8 (old L6 window said x2.2)
  function effLevel(n) { return n <= 5 ? n : (n <= 9 ? 5 + (n - 5) / 4 : n - 3); }
  function rampK(n) { return n <= 5 ? 0 : (n >= 9 ? 1 : (n - 5) / 4); }                       // 0 at L5 -> 1 at L9
  function chuteFor(n) { return Math.round(CHUTE_W + (L9_CHUTE - CHUTE_W) * rampK(n)); }       // 96 -> 84
  function gateWinBase(n) {
    var k = 1 + (L9_GATE_K - 1) * rampK(n), w = gateWinRaw(effLevel(n));
    return [w[0] * k, w[1] * k];
  }
  function gateWinRaw(n) {
    if (n <= GATE_WIN[0][0]) return [GATE_WIN[0][1], GATE_WIN[0][2]];
    for (var q = 1; q < GATE_WIN.length; q++) if (n <= GATE_WIN[q][0]) { var p0 = GATE_WIN[q - 1], p1 = GATE_WIN[q], t = (n - p0[0]) / (p1[0] - p0[0]); return [p0[1] + (p1[1] - p0[1]) * t, p0[2] + (p1[2] - p0[2]) * t]; }
    return [GATE_WIN[GATE_WIN.length - 1][1], GATE_WIN[GATE_WIN.length - 1][2]];
  }
  function fmtGate(v) { var t = Math.round(v * 10) / 10; return (t % 1 === 0) ? String(t) : t.toFixed(1); }
  function rollGate(kind, n, rnd) {
    var isX = rnd() < 0.5, lo, hi, a;
    var w = gateWin(n); if (isX) { lo = w[0]; hi = w[1]; } else { lo = w[0] - 1; hi = w[1] - 1; }   // '+n' makes n+1 mobs, so its window is the x window minus 1: the effective multiplier never passes the cap
    a = rnd(); if (kind === 'L') a = a * a * 0.85; else a = 0.35 + 0.65 * Math.sqrt(a);   // skew: lows cluster near the floor, highs near the ceiling
    var v = Math.round((lo + (hi - lo) * a) * 10) / 10;
    if (v === Math.round(v) && rnd() < 0.7) v += rnd() < 0.5 ? 0.1 : -0.1;                  // keep drops "organic": mostly non-integer
    var vmin = isX ? 1.1 : 0.2, wlo = Math.round(lo * 10) / 10, whi = Math.round(hi * 10) / 10; if (v < wlo) v = wlo; if (v > whi) v = whi; if (v < vmin) v = vmin;   // hard clamp: the jitter can never leave the window
    return isX ? ['x', v, 'x' + fmtGate(v)] : ['+', v, '+' + fmtGate(v)];
  }
  function tierOf(n) { return Math.ceil(n / TIER_SIZE); }
  // Throughput (blue hits/s) a perfect stream is expected to sustain: efficiency-scaled MTM, capped by the pool
  // Measured (bot-sim) efficiency is not constant: it falls as MTM grows (gates are missed, clones spread out, the
  // pool saturates). Fit: efficiency = MTM_EFF * MTM^-MTM_EFF_EXP  (~0.9 at MTM 2, ~0.35-0.45 at MTM 20-60, ~0.1 at 700).
  function levelThroughput(mtm) { return Math.min(SHOTS_PER_SEC * MTM_EFF * Math.pow(mtm, 1 - MTM_EFF_EXP), POOL_RATE_CAP); }

  // Max Theoretical Multiplier: blues one shot becomes after passing every positive gate, bottom to top
  // (gate defs are ordered bottom to top). Negative gates are ignored.
  function calculateLevelMTM(gates) {            // best single column (the player picks a column)
    var best = 1, cols = {}, i, g;
    for (i = 0; i < gates.length; i++) {
      g = gates[i]; var c = g[7] || 0; if (cols[c] === undefined) cols[c] = 1;
      if (g[2] === 'x') cols[c] *= g[3];
      else if (g[2] === '+') cols[c] *= g[3] + 1;   // '+n' turns each mob into n+1
    }
    for (var k in cols) if (cols[k] > best) best = cols[k];
    return best;
  }

  // gate def: [width, y, type, n, label, startRight, speed]
  //   types: 'x' multiply, '+' add, '-' tax (destroys up to n, recharges), '/' halve (destroys every 2nd)
  function generateLevel(n) {
    COL_W[1] = n === SANDBOX_LEVEL ? SANDBOX_W : chuteFor(n);
    if (n === SANDBOX_LEVEL) {                       // Phase 15: glass box. One wide column, an indestructible plug at the bottom, nothing else.
      var sx0 = (W - SANDBOX_W) / 2;
      return { n: n, tier: tierOf(n), baseHP: 1e6, mtm: 1, throughput: 0, isBoss: false, bossHP: 0, redInterval: 99, waveMin: 8, waveMax: 12, redSpeedMul: 1,
               mixTank: 0, mixSprinter: 0, terrain: [[sx0 + SANDBOX_W / 2, 470, SANDBOX_W / 2, 14, 0, 1, 255, 0]], gates: [], bumpers: [], holes: [],
               cols: 1, barrCol: [0], terrainEff: 1, sandbox: true };
    }
    var rnd = rng32(n * 7919 + 12345);
    var isBoss = (n % 10) === 0;
    var m = effLevel(n);                                       // difficulty level (see effLevel); n stays the level number / seed / boss test
    var tier = tierOf(m), tf = (tier - 1) * TIER_SIZE + 1;     // tier constants are those of the tier's first level
    var wMin = Math.min(MAX_WAVE, 8 + (tf - 1));
    var wMax = Math.min(MAX_WAVE, 12 + 2 * (tf - 1));
    var L = {
      n: n, tier: tier,
      baseHP: 0, mtm: 1, throughput: 0,
      isBoss: isBoss,
      bossHP: 0,
      redInterval: Math.max(2.5, 5.0 * Math.pow(0.98, tf - 1)),
      waveMin: wMin, waveMax: Math.max(wMin, wMax),

      setGates: function (defs) { gateCount = defs.length; for (var q = 0; q < defs.length; q++) { cfgGate(GATES[q], defs[q]); gateOn[q] = 1; } },

                 isBoss: isBossLevel, bossActive: bossActive, bossHP: bossHP, bossMaxHP: bossMaxHP, bossY: bossY, bossX: bossX,
                 capBlue: MAX_MOBS, capRed: MAX_RED,
                 redX: sl.call(rx, 0, redCount), redY: sl.call(ry, 0, redCount), redHP: sl.call(rhp, 0, redCount), redType: sl.call(rtype, 0, redCount),
                 waveQueue: waveQueue, crateTimer: crateTimer, terrainCount: terrainCount,
                 cols: colN, colX0: Array.prototype.slice.call(colX0, 0, colN), colX1: Array.prototype.slice.call(colX1, 0, colN), AX0: AX0, AX1: AX1,
                 surges: surges, surging: (function () { var q = 0; for (var z = 0; z < redCount; z++) if (rsurge[z] > 0) q++; return q; })(), rsurge: Array.prototype.slice.call(rsurge, 0, redCount),
                 redVY: Array.prototype.slice.call(rvy, 0, redCount), redVX: Array.prototype.slice.call(rvx, 0, redCount),
                 barr: (function () { var o = []; for (var q = 0; q < terrainCount; q++) o.push({ x: tCX[q], y: tCY[q], hw: tHW[q], hh: tHH[q], type: tType[q], hits: tHits[q] }); return o; })(), crateActive: crateActive, crateX: crateX, crateY: crateY, crateHP: crateHP,
                 pillCount: pillCount, pillX: sl.call(pillX, 0, pillCount), pillY: sl.call(pillY, 0, pillCount), powerName: powerName, powerLeft: powerLeft,

      Armory: Armory, RedMobTypes: RedMobTypes, equip: equip,
      RED_SPEED_CAP: RED_SPEED_CAP, CRATE_HP: CRATE_HP, POWER_TIME: POWER_TIME,
      setTerrain: setTerrain, setColumns: setColumns, openField: function () { colN = 1; colX0[0] = 10; colX1[0] = W - 10; AX0 = 10; AX1 = W - 10; },
      colOf: colOf, columnCount: columnCount, colSpan: colSpan, COL_W: COL_W, gateRoll: rollGate, redGravity: RED_GRAV, spawnCrate: spawnCrate, spawnPill: function (x, y, t) { spawnPill(x, y); if (t !== undefined) pillT[pillCount - 1] = t; },
      setCrateTimer: function (t) { crateTimer = t; }, queueWave: queueWave,

      BOSS_PIPE_RATE: BOSS_PIPE_RATE, setPaused: setPaused, isPaused: function () { return paused; }, tuneBoss: function (w, i) { BOSS_WAVE_K = w; BOSS_INT_K = i; }, PIPE_RATE: PIPE_RATE, bossParams: function () { return { wave: bossWave, interval: bossInterval }; },

      traceBlue: function (x0, ys) {
        var tbc = colOf(x0), tbl = colX0[tbc] + MOB_R, tbr = colX1[tbc] - MOB_R;

        for (var st = 0; st < 900 && k < ys.length; st++) {
          x += vx * dt; y += vy * dt;

          if (terrainCount && terrainResolve(x, y, MOB_R, true)) {
            x = pX; y = pY;
            var tn = vx * thNX + vy * thNY; if (tn < 0) { vx -= tn * thNX; vy -= tn * thNY; }
            var tt = vx * thTX + vy * thTY; if (tt > -SLIDE_MIN && tt < SLIDE_MIN) { vx += thTX * (SLIDE_MIN - tt); vy += thTY * (SLIDE_MIN - tt); }

          while (k < ys.length && y <= ys[k]) { ox.push(x); ot.push((st + 1) * dt); k++; }
        }
        while (k < ys.length) { ox.push(x); ot.push(99); k++; }

      },

      spawnRed: spawnRed,

    };
  }

  // Developer level warp: index.html?level=N starts directly at level N
  (function () {
    var m = typeof location !== 'undefined' ? (/[?&]level=(\d+)/.exec(location.search || '') || /[#&]level=(\d+)/.exec(location.hash || '')) : null;
    if (m) level = Math.max(1, Math.min(9999, parseInt(m[1], 10)));
  })();
  syncMuteBtn();
  resize();
  reset();
  requestAnimationFrame(function (t) { last = t; requestAnimationFrame(frame); });
})();

<script>
// Install button: appears only when Chrome says the app is installable and not installed (beforeinstallprompt). Menu "Install" can be unreliable.
(function () {
  var dip = null, b = document.createElement('button');
  b.textContent = 'Install app';
  b.style.cssText = 'display:none;position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9999;padding:8px 16px;border-radius:18px;border:1px solid #5a7acc;background:#1c2a55;color:#fff;font:700 14px system-ui,sans-serif';
  b.onclick = function () { if (dip) { dip.prompt(); dip = null; b.style.display = 'none'; } };
  document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(b); });
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); dip = e; b.style.display = 'block'; });
  window.addEventListener('appinstalled', function () { b.style.display = 'none'; });
})();
</script>
