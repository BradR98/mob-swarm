<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Mob Swarm - an ad-free, battery-friendly multiplier mob shooter.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<script id="sw-register">
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
<title>Mob Swarm</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #0b1020; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #overlay {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    background: rgba(8, 12, 28, 0.78);
  }
  #overlay.show { display: flex; }
  #overlay h1 {
    margin: 0; font-size: 52px; letter-spacing: 1px; color: #fff;
    text-shadow: 0 0 24px #3aa0ff, 0 0 48px #3aa0ff;
    animation: pop .5s cubic-bezier(.2,1.6,.4,1);
  }
  #overlay.lose h1 { text-shadow: 0 0 24px #ff3b4e, 0 0 48px #ff3b4e; }
  #overlay button {
    font: inherit; font-size: 20px; font-weight: 700; color: #fff;
    padding: 14px 40px; border: 0; border-radius: 999px; cursor: pointer;
    background: linear-gradient(180deg, #4db3ff, #1c6fe0);
    box-shadow: 0 6px 0 #124a9c, 0 10px 24px rgba(0,0,0,.5);
  }
  #overlay button:active { transform: translateY(4px); box-shadow: 0 2px 0 #124a9c; }
  #mute {
    position: absolute; top: 8px; right: 10px; z-index: 5;
    width: 36px; height: 36px; padding: 0; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.25); background: rgba(20,30,60,.7);
    color: #fff; font-size: 18px; line-height: 34px; text-align: center; cursor: pointer;
  }
  #mute:active { transform: scale(.92); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="overlay">
      <h1 id="overlayTitle">Victory!</h1>
      <button id="restart" type="button">Next Level</button>
    </div>
    <button id="mute" type="button" aria-label="Mute audio" title="Mute / unmute">&#128266;</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------- Config (logical portrait space) ----------
  var W = 360, H = 640;
  var MAX_MOBS = 1500;           // blue pool capacity
  var MAX_RED = 500;             // red pool capacity
  var MOB_R = 4, RED_R = 7;

  // ---------- The Armory: player cannon stats ----------
  //   fireRate: ms between shots; bulletVelocity: px/s upward; piercing: red HP one blue can subtract before dying
  var Armory = {
    standard: { name: 'Standard', fireRate: 111, bulletVelocity: 250, piercing: 1, pellets: 1, spreadVx: 0 },
    piercer:  { name: 'Piercer',  fireRate: 111, bulletVelocity: 250, piercing: 2, pellets: 1, spreadVx: 0 },
    rapid:    { name: 'Rapid',    fireRate: 80,  bulletVelocity: 280, piercing: 1, pellets: 1, spreadVx: 0 },
    // Supply-crate power-ups (temporary, POWER_TIME seconds). pellets/spreadVx: shots per trigger / sideways px/s between them
    shotgun:  { name: 'Shotgun',  fireRate: 111, bulletVelocity: 250, piercing: 1, pellets: 3, spreadVx: 85 },
    piercingRounds: { name: 'Piercing Rounds', fireRate: 111, bulletVelocity: 250, piercing: 3, pellets: 1, spreadVx: 0 }
  };
  var POWER_NAMES = ['shotgun', 'piercingRounds'];
  var weapon = Armory.standard, baseWeaponName = 'standard';
  var MOB_SPEED = weapon.bulletVelocity;      // px/s upward (blue); follows the equipped weapon
  var FIRE_RATE = 1000 / weapon.fireRate;     // shots/s
  function setWeapon(w) { weapon = w; MOB_SPEED = w.bulletVelocity; FIRE_RATE = 1000 / w.fireRate; }
  function equip(name) { baseWeaponName = Armory[name] ? name : 'standard'; if (!(powerLeft > 0)) setWeapon(Armory[baseWeaponName]); }

  // ---------- The Bestiary: red mob dictionary ----------
  //   speed / radius are multipliers of the base red; hp in blue-damage points
  var RED_SPEED_BASE = 187.5;     // px/s downward (red); scaled per tier
  var RED_SPEED_CAP = 280;        // hard cap on any red's descent speed: late game scales density and shields, never speed
  var RedMobTypes = {
    Basic:    { id: 0, speed: 1.0, radius: 1.0, hp: 2, color: '#ff4d5e', wound: '#ff9a3c' },
    Tank:     { id: 1, speed: 0.5, radius: 1.5, hp: 5, color: '#8a1020', wound: '#c8404f' },
    Sprinter: { id: 2, speed: 1.5, radius: 0.7, hp: 1, color: '#ff8a00', wound: '#ffb84d' }
  };
  var RT_LIST = [RedMobTypes.Basic, RedMobTypes.Tank, RedMobTypes.Sprinter];
  var RT_SPEED = new Float32Array(3), RT_RAD = new Float32Array(3), RT_HP = new Uint8Array(3), RT_HIT2 = new Float32Array(3);
  for (var rti = 0; rti < 3; rti++) {
    RT_SPEED[rti] = RT_LIST[rti].speed; RT_RAD[rti] = RT_LIST[rti].radius * RED_R; RT_HP[rti] = RT_LIST[rti].hp;
    RT_HIT2[rti] = (MOB_R + RT_RAD[rti]) * (MOB_R + RT_RAD[rti]);
  }
  var SPREAD = 14;               // px/s sideways jitter at fire
  var BASE_Y = 52, BASE_H = 64;  // base rect top / height (HUD lives above)
  var BASE_BOTTOM = BASE_Y + BASE_H;
  var CANNON_Y = H - 56;
  var CANNON_MAX_HP = 5;
  var MAX_DT = 1 / 20;           // clamp huge frame gaps
  var FUNNEL = 0.7;              // 0 = waves from center, 1 = exactly over the blue cluster
  var RED_ATTRACT = 0.8, RED_ATTRACT_MAX = 45;      // red lateral pull toward blue mass
  var BLUE_ATTRACT = 0.5, BLUE_ATTRACT_MAX = 70;    // blue lateral accel toward red mass

  var MAX_LEVEL = 100;           // HUD denominator; generator keeps working beyond it
  var MAX_GATES = 6;             // bits 0-5 of the mob gate mask (bit 7 = "bumped/sucked" flag)
  var MAX_BUMPERS = 8, MAX_HOLES = 4;
  var MAX_WAVE = 150;            // hard cap on red wall size (two walls always fit the 500 pool)
  var NEG_RECHARGE = 0.5;        // '-' gates regain n * this per second
  var BOSS_W = W * 0.4, BOSS_H = 56, BOSS_STRAFE = 22;   // mothership: 40% of screen width, slow drift (px/s)
  var SHOTS_PER_SEC = 9;                  // must match FIRE_RATE; used by the HP formulas
  var BASE_TTK = 35, BOSS_TTK = 45;       // target perfect-stream seconds to clear
  var HP_PER_TIER = 0.02;                 // +2% base HP per tier
  var MTM_EFF = 1.05, MTM_EFF_EXP = 0.3;                    // measured share of the theoretical multiplier a real stream achieves
  var OBST_BUMPER_EFF = 0.92, OBST_HOLE_EFF = 0.85;   // throughput kept per bumper / black hole (measured)
  var POOL_RATE_CAP = 250;                // blue hits/s the 1500-mob pool can sustain (lifetime ~1.8s, with headroom)
  var TIER_SIZE = 5;
  var TERRAIN_EFF = 0.93;                 // throughput kept per terrain piece (measured)
  var MAX_TERRAIN = 8, SLIDE_MIN = 70, RED_SLIDE = 90;   // min tangential slide speed so mobs never stall on a flat face
  var PIPE_RATE = 14;                     // reds/s leaving the pipe (spacing ~ 1 body at base speed)
  var CRATE_R = 16, CRATE_HP = 30, CRATE_SPEED = 16, CRATE_MIN = 15, CRATE_MAX = 20;   // supply crate
  var PILL_MAX = 4, PILL_SPEED = 100, POWER_TIME = 8;
  var HOLE_R = 80, HOLE_CORE = 10, HOLE_G = 480;    // black hole pull radius / kill radius / pull accel
  var FLAG_BUMPED = 128;

  var PLAYING = 0, WON = 1, LOST = 2;

  // ---------- Procedural level generator ----------
  // Seeded PRNG: level N always generates the same board.
  function rng32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clampN(v, a, b) { return v < a ? a : (v > b ? b : v); }

  var GATE_SLOTS = [400, 360, 320, 280, 240, 200];            // y centers, bottom to top (40px apart, never overlap)
  var LOW_POOL = [['x', 2, 'x2'], ['+', 2, '+2']];       // wide, near the cannon
  var HIGH_POOL = [['x', 3, 'x3'], ['+', 10, '+10']];    // narrow, high up near the enemy
  function tierOf(n) { return Math.ceil(n / TIER_SIZE); }
  // Throughput (blue hits/s) a perfect stream is expected to sustain: efficiency-scaled MTM, capped by the pool
  // Measured (bot-sim) efficiency is not constant: it falls as MTM grows (gates are missed, clones spread out, the
  // pool saturates). Fit: efficiency = MTM_EFF * MTM^-MTM_EFF_EXP  (~0.9 at MTM 2, ~0.35-0.45 at MTM 20-60, ~0.1 at 700).
  function levelThroughput(mtm) { return Math.min(SHOTS_PER_SEC * MTM_EFF * Math.pow(mtm, 1 - MTM_EFF_EXP), POOL_RATE_CAP); }

  // Max Theoretical Multiplier: blues one shot becomes after passing every positive gate, bottom to top
  // (gate defs are ordered bottom to top). Negative gates are ignored.
  function calculateLevelMTM(gates) {
    var c = 1;
    for (var i = 0; i < gates.length; i++) {
      if (gates[i][2] === 'x') c *= gates[i][3];
      else if (gates[i][2] === '+') c *= gates[i][3] + 1;   // '+n' turns each mob into n+1
    }
    return c;
  }

  // gate def: [width, y, type, n, label, startRight, speed]
  //   types: 'x' multiply, '+' add, '-' tax (destroys up to n, recharges), '/' halve (destroys every 2nd)
  function generateLevel(n) {
    var rnd = rng32(n * 7919 + 12345);
    var isBoss = (n % 10) === 0;
    var tier = tierOf(n), tf = (tier - 1) * TIER_SIZE + 1;     // tier constants are those of the tier's first level
    var wMin = Math.min(MAX_WAVE, 8 + (tf - 1));
    var wMax = Math.min(MAX_WAVE, 12 + 2 * (tf - 1));
    var L = {
      n: n, tier: tier,
      baseHP: 0, mtm: 1, throughput: 0,
      isBoss: isBoss,
      bossHP: 0,
      redInterval: Math.max(2.5, 7.0 * Math.pow(0.98, tf - 1)),
      waveMin: wMin, waveMax: Math.max(wMin, wMax),
      redSpeedMul: 1 + Math.min(0.25, (tf - 1) * 0.005),   // speed growth is capped; density and shields carry late game
      mixTank: tier >= 2 ? Math.min(0.45, 0.2 + 0.03 * (tier - 2)) : 0, mixSprinter: tier >= 4 ? Math.min(0.3, 0.2 + 0.02 * (tier - 4)) : 0,
      pipeX: n === 1 ? W / 2 : 80 + rnd() * 200, terrain: [],   // Bestiary unlocks: Tier 2 Tanks, Tier 4 Sprinters
      gates: [], bumpers: [], holes: []
    };
    var i, j;

    // --- gate layout (risk vs reward): lows wide + low, highs narrow + high, negatives wide, directly below a high ---
    var nLow = n === 1 ? 1 : 1 + ((rnd() * 2) | 0), nHigh = n === 1 ? 0 : 1 + ((rnd() * 2) | 0);
    var nNeg = tier >= 3 ? ((nHigh === 2 && tier >= 4) ? 2 : 1) : 0;          // negative gates arrive in Tier 3
    if (nNeg > nHigh) nNeg = nHigh;
    var seq = [];                                                            // bottom to top
    for (i = 0; i < nLow; i++) seq.push('L');
    for (i = 0; i < nHigh; i++) { if (i < nNeg) seq.push('N'); seq.push('H'); }
    var defs = [], hasX = false;
    for (i = 0; i < seq.length; i++) {
      var speed = Math.min(240, 55 + n * 2 + rnd() * 20), kind = seq[i], d, w;
      if (kind === 'L') {
        d = LOW_POOL[(rnd() * 2) | 0]; w = Math.round(clampN(135 - tier, 100, 135) + (rnd() - 0.5) * 16);
        defs.push([w, GATE_SLOTS[i], d[0], d[1], d[2], rnd() < 0.5, speed]);
      } else if (kind === 'H') {
        d = HIGH_POOL[(rnd() * 2) | 0]; w = Math.round(clampN(70 - tier * 2, 44, 70) + (rnd() - 0.5) * 10);
        defs.push([w, GATE_SLOTS[i], d[0], d[1], d[2], rnd() < 0.5, speed]);
      } else {
        d = rnd() < 0.5 ? ['-', 10, '-10'] : ['/', 2, '/2']; w = 110 + Math.round(rnd() * 20);
        defs.push([w, GATE_SLOTS[i], d[0], d[1], d[2], false, speed * 1.05]);
      }
      if (d[0] === 'x') hasX = true;
    }
    if (!hasX) { var fx = defs[0], hi = fx[0] < 90; fx[2] = 'x'; fx[3] = hi ? 3 : 2; fx[4] = hi ? 'x3' : 'x2'; }   // always at least one multiplier
    for (i = 0; i < defs.length; i++) {                 // each negative slides opposite the high gate it guards (the next one up)
      if (seq[i] === 'N') defs[i][5] = !defs[i + 1][5];
    }
    L.gates = defs;
    L.mtm = calculateLevelMTM(defs);

    // --- static obstacles (placed away from gate rows and each other) ---
    var taken = [];
    function place(r, avoidGates, yMin, yMax) {
      for (var tries = 0; tries < 60; tries++) {
        var x = 30 + rnd() * 300, y = yMin + rnd() * (yMax - yMin), ok = true, q;
        if (avoidGates) for (q = 0; q < defs.length; q++) if (Math.abs(y - defs[q][1]) < 13 + r + 12) { ok = false; break; }
        if (!ok) continue;
        for (q = 0; q < taken.length; q++) {
          var dx = x - taken[q][0], dy = y - taken[q][1];
          if (Math.sqrt(dx * dx + dy * dy) < r + taken[q][2] + 14) { ok = false; break; }
        }
        if (ok) { var c = [x, y, r]; taken.push(c); return c; }
      }
      return null;
    }
    if (n >= 51) {                                   // black holes first (they may sit behind sliding gates)
      var nh = Math.min(MAX_HOLES, 1 + (((n - 51) / 12) | 0));
      for (i = 0; i < nh; i++) { var h = place(HOLE_R * 0.55, false, 170, 470); if (h) L.holes.push([h[0], h[1]]); }
    }
    if (n >= 31) {                                   // pinball bumpers, kept clear of gate rows
      var nb = Math.min(MAX_BUMPERS, 2 + (((n - 31) / 4) | 0));
      for (i = 0; i < nb; i++) { var b = place(12 + rnd() * 5, true, 140, 500); if (b) L.bumpers.push(b); }
    }
    // --- static terrain: gray OBBs [cx, cy, halfW, halfH, angle] in the free bands above and below the gate rows ---
    function hitsPiece(pc, x, y, r) {
      var c = Math.cos(pc[4]), sn = Math.sin(pc[4]), dx = x - pc[0], dy = y - pc[1];
      var lx = dx * c + dy * sn, ly = -dx * sn + dy * c;
      var ex = Math.max(Math.abs(lx) - pc[2], 0), ey = Math.max(Math.abs(ly) - pc[3], 0);
      return ex * ex + ey * ey < r * r;
    }
    function pattern(kind, y0, y1, flip) {
      var h = y1 - y0, cy = (y0 + y1) / 2, out = [], k;
      if (kind === 0) {                                         // central pillar(s)
        var ph = Math.min(h - 20, 46) / 2;
        if (ph < 10) return out;
        if (rnd() < 0.5) out.push([112, cy, 24, ph, 0], [248, cy, 24, ph, 0]);
        else out.push([180 + (rnd() - 0.5) * 60, cy, 34, ph, 0]);
      } else if (kind === 1) {                                  // angled funnel: two walls with a 56px mouth
        var rise = Math.min(h - 14, 80);
        if (rise < 30) return out;
        var fx = 180 + (rnd() - 0.5) * 70, yo = flip ? cy - rise / 2 : cy + rise / 2, yi = flip ? cy + rise / 2 : cy - rise / 2;
        var sides = [-1, 1];
        for (k = 0; k < 2; k++) {
          var ox = Math.min(310, Math.max(50, fx + sides[k] * 110)), ix = fx + sides[k] * 28;   // outer ends stop short of the edges so nothing is sealed in
          out.push([(ox + ix) / 2, (yo + yi) / 2, Math.sqrt((ox - ix) * (ox - ix) + (yo - yi) * (yo - yi)) / 2, 5, Math.atan2(yi - yo, ix - ox), flip ? -1 : 1]);   // slide toward the mouth (or round the outer end when inverted)
        }
      } else {                                                  // zig-zag baffles
        var nw = Math.min(3, Math.floor((h - 24) / 34));
        if (nw < 2) return out;
        var sp = (h - 24) / nw;
        for (k = 0; k < nw; k++) {
          var fromLeft = (k % 2 === 0) !== flip;
          out.push([fromLeft ? 125 : 235, y0 + 12 + sp * (k + 0.5), 115, 5, fromLeft ? 0.1 : -0.1, fromLeft ? 1 : -1]);   // slide toward the open gap
        }
      }
      return out;
    }
    if (n >= 2) {
      var topGate = GATE_SLOTS[defs.length - 1], zones = [[430, 535]];
      if (topGate - 13 - 10 - 140 >= 50) zones.push([140, topGate - 13 - 10]);
      for (var zi = 0; zi < zones.length; zi++) {
        var placed = false;
        for (var tries = 0; tries < 40; tries++) {
          /* upper band (y0 = 140): funnels only ever narrow toward the boss/base */ var pcs = pattern((rnd() * 3) | 0, zones[zi][0], zones[zi][1], zones[zi][0] > 140 ? rnd() < 0.5 : false), clear = pcs.length > 0, a2, b2;
          for (a2 = 0; a2 < pcs.length && clear; a2++) {
            for (b2 = 0; b2 < L.bumpers.length; b2++) if (hitsPiece(pcs[a2], L.bumpers[b2][0], L.bumpers[b2][1], L.bumpers[b2][2] + 6)) clear = false;
            for (b2 = 0; b2 < L.holes.length; b2++) if (hitsPiece(pcs[a2], L.holes[b2][0], L.holes[b2][1], HOLE_CORE + 14)) clear = false;
          }
          if (clear && L.terrain.length + pcs.length <= MAX_TERRAIN) { for (a2 = 0; a2 < pcs.length; a2++) L.terrain.push(pcs[a2]); placed = true; break; }
        }
        if (!placed) {                                  // crowded board: clear the bumpers a layout overlaps (never the black holes)
          for (tries = 0; tries < 12 && !placed; tries++) {
            var pc2 = pattern((rnd() * 3) | 0, zones[zi][0], zones[zi][1], zones[zi][0] > 140 ? rnd() < 0.5 : false), ok2 = pc2.length > 0, keep = [];
            for (a2 = 0; a2 < pc2.length && ok2; a2++) for (b2 = 0; b2 < L.holes.length; b2++) if (hitsPiece(pc2[a2], L.holes[b2][0], L.holes[b2][1], HOLE_CORE + 14)) ok2 = false;
            if (!ok2 || L.terrain.length + pc2.length > MAX_TERRAIN) continue;
            for (b2 = 0; b2 < L.bumpers.length; b2++) {
              var hitB = false;
              for (a2 = 0; a2 < pc2.length; a2++) if (hitsPiece(pc2[a2], L.bumpers[b2][0], L.bumpers[b2][1], L.bumpers[b2][2] + 6)) hitB = true;
              if (!hitB) keep.push(L.bumpers[b2]);
            }
            if (keep.length < Math.min(2, L.bumpers.length)) continue;
            L.bumpers = keep;
            for (a2 = 0; a2 < pc2.length; a2++) L.terrain.push(pc2[a2]);
            placed = true;
          }
        }
      }
    }

    // HP is set last so obstacle derating can use the final layout: bumpers and black holes bleed stream throughput
    L.throughput = levelThroughput(L.mtm) * Math.pow(OBST_BUMPER_EFF, L.bumpers.length) * Math.pow(OBST_HOLE_EFF, L.holes.length) * Math.pow(TERRAIN_EFF, L.terrain.length);
    L.baseHP = Math.round(L.throughput * BASE_TTK * (1 + HP_PER_TIER * (tier - 1)));
    L.bossHP = isBoss ? Math.round(L.throughput * BOSS_TTK) : 0;
    return L;
  }

  // Gate objects are pre-allocated and reconfigured per level. They slide between [min, max] and bounce.
  var GATES = [{}, {}, {}, {}, {}, {}];
  var gateCount = 0;
  function cfgGate(G, d) {
    G.w = d[0]; G.y = d[1]; G.h = 26; G.type = d[2]; G.n = d[3]; G.label = d[4];
    G.startRight = d[5]; G.speed = d[6];
    G.min = 10; G.max = W - 10 - G.w;
    G.x = G.startRight ? G.max : G.min;
    G.vx = G.startRight ? -G.speed : G.speed;
    G.charges = G.n; G.flip = 0;             // state for '-' and '/' gates
  }

  // Static obstacles (typed, fixed capacity)
  var bumpX = new Float32Array(MAX_BUMPERS), bumpY = new Float32Array(MAX_BUMPERS), bumpR = new Float32Array(MAX_BUMPERS);
  var bumpCount = 0;
  var holeX = new Float32Array(MAX_HOLES), holeY = new Float32Array(MAX_HOLES);
  var holeCount = 0;

  // Terrain: solid indestructible oriented rectangles. Mobs never bounce off them: the penetration is pushed out along
  // the surface normal and the velocity component into the wall is stripped, so they slide along the edge.
  var tCX = new Float32Array(MAX_TERRAIN), tCY = new Float32Array(MAX_TERRAIN), tHW = new Float32Array(MAX_TERRAIN), tHH = new Float32Array(MAX_TERRAIN);
  var tCos = new Float32Array(MAX_TERRAIN), tSin = new Float32Array(MAX_TERRAIN), tDir = new Int8Array(MAX_TERRAIN);   // tDir: preferred slide end along local +x (+1 / -1), 0 = nearest end
  var terrainCount = 0;
  var pX = 0, pY = 0, thNX = 0, thNY = 0, thTX = 0, thTY = 0;   // resolve outputs (no allocation)
  function setTerrain(list) {
    terrainCount = Math.min(MAX_TERRAIN, list.length);
    for (var k = 0; k < terrainCount; k++) {
      tCX[k] = list[k][0]; tCY[k] = list[k][1]; tHW[k] = list[k][2]; tHH[k] = list[k][3];
      tCos[k] = Math.cos(list[k][4]); tSin[k] = Math.sin(list[k][4]); tDir[k] = list[k][5] || 0;
    }
  }
  // Pushes circle (x, y, r) out of every terrain rect. Returns true if it touched any; result in pX/pY, last normal in thN*,
  // thT* = tangent pointing toward the nearer end of the rect (where the mob should slide round).
  function terrainResolve(x, y, r) {
    pX = x; pY = y;
    var hit = false;
    for (var k = 0; k < terrainCount; k++) {
      var c = tCos[k], sn = tSin[k], hw = tHW[k], hh = tHH[k];
      var dx = pX - tCX[k], dy = pY - tCY[k];
      var lx = dx * c + dy * sn, ly = -dx * sn + dy * c;

          if (bdot < 0) { vx -= 2 * bdot * bnx; vy -= 2 * bdot * bny; }
          mmask[i] |= FLAG_BUMPED;
          sfxBump();
        }
      }
      // Black holes: swirling pull, destroy at the core
      var sucked = false;
      for (k = 0; k < holeCount; k++) {
        var hdx = holeX[k] - x, hdy = holeY[k] - y, hd2 = hdx * hdx + hdy * hdy;
        if (hd2 < holeR2) {
          var hd = Math.sqrt(hd2);
          if (hd < HOLE_CORE) { sucked = true; break; }
          var pull = HOLE_G * (1 - hd / HOLE_R) * dt, ux = hdx / hd, uy = hdy / hd;
          vx += (ux - uy * 0.35) * pull; vy += (uy + ux * 0.35) * pull;
          mmask[i] |= FLAG_BUMPED;
        }
      }
      if (sucked) { spawnPop(x, y); killMob(i); continue; }
      // Terrain: slide along the surface (strip the velocity into the wall, never reflect)
      if (terrainCount && terrainResolve(x, y, MOB_R)) {
        x = pX; y = pY;
        var tvn = vx * thNX + vy * thNY;
        if (tvn < 0) { vx -= tvn * thNX; vy -= tvn * thNY; }
        var ttv = vx * thTX + vy * thTY;
        if (ttv > -SLIDE_MIN && ttv < SLIDE_MIN) { vx += thTX * (SLIDE_MIN - ttv); vy += thTY * (SLIDE_MIN - ttv); }
        mmask[i] |= FLAG_BUMPED;
      }
      // Mobs that were bumped/pulled drift back to their upward cruise speed
      if (mmask[i] & FLAG_BUMPED) vy += (-MOB_SPEED - vy) * Math.min(1, dt * 3);

      vx *= (1 - Math.min(1, dt * 2.5));     // scatter bleeds off
      mvx[i] = vx; mvy[i] = vy; mx[i] = x; my[i] = y;
      if (y > H) { killMob(i); continue; }   // bounced all the way back down
      bSum += x; bN++;

      // Boss: each blue impact does 1 damage
      if (bossActive) {
        var sdx = x - bossX, sdy = y - bossY;
        if (sdx <= bhx && sdx >= -bhx && sdy <= bhy && sdy >= -bhy) {
          bossHP--; bossHeat = bossHeat < 1 ? bossHeat + 0.1 : 1;
          if ((bossHP & 15) === 0) spawnPop(x, y);
          sfxHit();
          killMob(i);
          if (bossHP <= 0) { bossHP = 0; spawnPop(bossX, bossY); endGame(WON); return; }
          continue;
        }
      }

      // Supply crate: absorbs blue impacts until broken
      if (crateActive) {
        var cdx = x - crateX, cdy = y - crateY;
        if (cdx * cdx + cdy * cdy <= (CRATE_R + MOB_R) * (CRATE_R + MOB_R)) {
          crateHP--; killMob(i); sfxHit();
          if (crateHP <= 0) { crateActive = false; crateTimer = CRATE_MIN + Math.random() * (CRATE_MAX - CRATE_MIN); spawnPill(crateX, crateY); spawnPop(crateX, crateY); }
          continue;
        }
      }

      // Gates: circle-vs-rect overlap while moving up; each gate fires at most once per mob
      if (vy < 0) {
        var m = mmask[i];
        var gateKilled = false;
        for (gi = 0; gi < gateCount; gi++) {
          var bit = 1 << gi;
          if (m & bit) continue;
          var gt = GATES[gi], hh = gt.h * 0.5;
          if (x + MOB_R >= gt.x && x - MOB_R <= gt.x + gt.w &&
              y + MOB_R >= gt.y - hh && y - MOB_R <= gt.y + hh) {
            mmask[i] = (m |= bit);
            if (gt.type === '-') {            // tax: destroys the mob while charges remain
              if (gt.charges >= 1) { gt.charges -= 1; gateFlash[gi] = 1; sfxNeg(); gateKilled = true; break; }
            } else if (gt.type === '/') {     // halve: every 2nd mob is destroyed
              gt.flip ^= 1;
              if (gt.flip) { gateFlash[gi] = 1; sfxNeg(); gateKilled = true; break; }
            } else {
              applyGate(i, gi, x, y);
            }
          }
        }
        if (gateKilled) { killMob(i); continue; }
      }

      // Opponent base (on boss levels the base is shielded: it absorbs blues without damage)
      if (y <= BASE_BOTTOM) {
        if (x >= 10 && x <= W - 10) {
          if (!isBossLevel) {
            baseHP--; baseHeat = baseHeat < 1 ? baseHeat + 0.12 : 1;
            if (baseHP <= 0) { baseHP = 0; killMob(i); endGame(WON); return; }
          }
          killMob(i);
          continue;
        }
        if (y < -10) { killMob(i); continue; }
      }
      i++;
    }
    blueN = bN;
    blueCX = bN > 0 ? bSum / bN : W / 2;

    // Red mobs march down. The whole red mass drifts toward the blue mass as one body
    // (shared velocity from the centroid offset) so walls keep their shape instead of collapsing to a column.
    var killedBlue = 0, killedRed = 0;
    var rdy = redSpeed * dt;
    var v = 0;
    if (blueN > 0 && redCount > 0) {
      v = (blueCX - redCX) * RED_ATTRACT;
      v = v > RED_ATTRACT_MAX ? RED_ATTRACT_MAX : (v < -RED_ATTRACT_MAX ? -RED_ATTRACT_MAX : v);
    }
    var kd = 1 - Math.min(1, dt * 2.5);
    for (i = 0; i < redCount; i++) {
      rvx[i] = v;
      rkx[i] *= kd; rky[i] *= kd;
      var nx = rx[i] + (v + rkx[i]) * dt;
      var rspd = redSpeed * RT_SPEED[rtype[i]]; if (rspd > RED_SPEED_CAP) rspd = RED_SPEED_CAP;
      var ny = ry[i] + rspd * dt + rky[i] * dt;
      nx = nx < RED_R ? RED_R : (nx > W - RED_R ? W - RED_R : nx);
      if (ny < BASE_BOTTOM + RED_R) { ny = BASE_BOTTOM + RED_R; if (rky[i] < 0) rky[i] = 0; }

      for (k = 0; k < bumpCount; k++) {          // bumpers knock reds off course
        var rdx = nx - bumpX[k], rdyy = ny - bumpY[k], rrr = bumpR[k] + RED_R;
        var rd2 = rdx * rdx + rdyy * rdyy;
        if (rd2 < rrr * rrr) {
          var rd = Math.sqrt(rd2) || 0.001, rnx = rdx / rd, rny = rdyy / rd;
          nx = bumpX[k] + rnx * (rrr + 0.1); ny = bumpY[k] + rny * (rrr + 0.1);
          var rdot = (v + rkx[i]) * rnx + (redSpeed + rky[i]) * rny;
          if (rdot < 0) { rkx[i] += -1.8 * rdot * rnx; rky[i] += -1.8 * rdot * rny; }
          sfxBump();
        }
      }
      var eaten = false;
      for (k = 0; k < holeCount; k++) {          // black holes drag reds in and destroy them
        var qx = holeX[k] - nx, qy = holeY[k] - ny, qd2 = qx * qx + qy * qy;
        if (qd2 < holeR2) {
          var qd = Math.sqrt(qd2);
          if (qd < HOLE_CORE) { eaten = true; break; }
          var qp = HOLE_G * 0.6 * (1 - qd / HOLE_R) * dt, qux = qx / qd, quy = qy / qd;
          rkx[i] += (qux - quy * 0.35) * qp; rky[i] += (quy + qux * 0.35) * qp;
        }
      }
      if (terrainCount && terrainResolve(nx, ny, RT_RAD[rtype[i]])) {      // slide: only the normal component is removed
        nx = pX; ny = pY;
        if (thNY < -0.5 || thNY > 0.5) nx += thTX * RED_SLIDE * dt;       // head-on against a flat face: slide round the end
      }
      rx[i] = nx; ry[i] = ny;
      if (eaten) { rdead[i] = 1; killedRed++; spawnPop(nx, ny); }
    }

    // Crowding: reds shove each other, then terrain re-resolves so nobody is squeezed into a wall
    if (redCount > 1) {
      separateReds(); separateReds();
      for (i = 0; i < redCount; i++) {
        var rr0 = RT_RAD[rtype[i]], qx2 = rx[i], qy2 = ry[i];
        if (terrainCount && terrainResolve(qx2, qy2, rr0)) { qx2 = pX; qy2 = pY; }
        rx[i] = qx2 < rr0 ? rr0 : (qx2 > W - rr0 ? W - rr0 : qx2);
        ry[i] = qy2 < BASE_BOTTOM + rr0 ? BASE_BOTTOM + rr0 : qy2;
      }
    }

    // Boss hovers at the base line, strafing left and right like a moving base
    if (bossActive) {
      bossX += bossDir * bossSpeed * dt;
      if (bossX > W - BOSS_W / 2 - 10) { bossX = W - BOSS_W / 2 - 10; bossDir = -1; }
      else if (bossX < BOSS_W / 2 + 10) { bossX = BOSS_W / 2 + 10; bossDir = 1; }
    }

    // Blue-vs-red: bucket blues in the grid, each red tests its 3x3 neighbourhood.
    // Kills are only flagged here; compaction happens after, so grid indices stay valid.
    if (redCount > 0 && mobCount > 0) {
      var c;
      for (c = 0; c < gridHead.length; c++) gridHead[c] = -1;
      for (i = 0; i < mobCount; i++) {
        c = cellY(my[i]) * COLS + cellX(mx[i]);
        gridNext[i] = gridHead[c];
        gridHead[c] = i;
      }
      for (var r = 0; r < redCount; r++) {
        if (rdead[r]) continue;
        var cx = cellX(rx[r]), cy = cellY(ry[r]);
        var x0 = cx > 0 ? cx - 1 : 0, x1 = cx < COLS - 1 ? cx + 1 : COLS - 1;
        var y0 = cy > 0 ? cy - 1 : 0, y1 = cy < ROWS - 1 ? cy + 1 : ROWS - 1;
        search:
        for (var yy = y0; yy <= y1; yy++) {
          for (var xx = x0; xx <= x1; xx++) {
            for (var b = gridHead[yy * COLS + xx]; b !== -1; b = gridNext[b]) {
              if (bdead[b]) continue;
              var dx = mx[b] - rx[r], dy = my[b] - ry[r];
              if (dx * dx + dy * dy <= RT_HIT2[rtype[r]]) {
                var dmg = bpierce[b] < rhp[r] ? bpierce[b] : rhp[r];     // piercing: one blue subtracts up to `piercing` red HP
                rhp[r] -= dmg; bpierce[b] -= dmg;
                if (bpierce[b] === 0) { bdead[b] = 1; killedBlue++; }
                if (rhp[r] === 0) { rdead[r] = 1; killedRed++; }   // first hit only wounds (orange)
                spawnPop((mx[b] + rx[r]) * 0.5, (my[b] + ry[r]) * 0.5);
                sfxHit();
                break search;
              }
            }
          }
        }
      }
    }
    if (killedBlue) {                        // compact blue pool
      var w = 0;
      for (i = 0; i < mobCount; i++) {
        if (bdead[i]) continue;
        if (w !== i) { mx[w] = mx[i]; my[w] = my[i]; mvx[w] = mvx[i]; mvy[w] = mvy[i]; mmask[w] = mmask[i]; bpierce[w] = bpierce[i]; }
        bdead[w] = 0;
        w++;
      }
      mobCount = w;
    }
    if (killedRed) {                         // compact red pool
      var wr = 0;
      for (i = 0; i < redCount; i++) {
        if (rdead[i]) continue;
        if (wr !== i) { rx[wr] = rx[i]; ry[wr] = ry[i]; rvx[wr] = rvx[i]; rhp[wr] = rhp[i]; rtype[wr] = rtype[i]; rkx[wr] = rkx[i]; rky[wr] = rky[i]; }
        rdead[wr] = 0;
        wr++;
      }
      redCount = wr;
    }

    // Reds crossing the cannon line each deal 1 damage and are recycled
    var hits = 0;
    i = 0;
    while (i < redCount) {
      if (ry[i] >= CANNON_Y) {
        spawnPop(rx[i], CANNON_Y);
        var l = --redCount;
        if (i !== l) { rx[i] = rx[l]; ry[i] = ry[l]; rvx[i] = rvx[l]; rhp[i] = rhp[l]; rtype[i] = rtype[l]; rkx[i] = rkx[l]; rky[i] = rky[l]; }
        rdead[i] = 0;
        hits++;
      } else i++;
    }
    if (hits) {
      cannonHP -= hits; cannonFlash = 1;
      sfxCannonHit();
      if (cannonHP <= 0) { cannonHP = 0; endGame(LOST); return; }
    }

    // Supply crate drifts down (sliding round terrain); pills fall and are caught by the cannon
    if (crateActive) {
      crateY += CRATE_SPEED * dt;
      if (terrainCount && terrainResolve(crateX, crateY, CRATE_R)) { crateX = pX; crateY = pY; crateX += thTX * 30 * dt; }
      if (crateY > CANNON_Y - 40) { crateActive = false; crateTimer = CRATE_MIN + Math.random() * (CRATE_MAX - CRATE_MIN); }
    }
    for (i = 0; i < pillCount; ) {
      pillY[i] += PILL_SPEED * dt;
      var pdx = pillX[i] - cannonX;
      if (pillY[i] >= CANNON_Y - 24 && pillY[i] <= CANNON_Y + 24 && pdx <= 28 && pdx >= -28) {
        activatePower(pillT[i]); sfxGate();
        pillCount--; pillX[i] = pillX[pillCount]; pillY[i] = pillY[pillCount]; pillT[i] = pillT[pillCount];
      } else if (pillY[i] > H) {
        pillCount--; pillX[i] = pillX[pillCount]; pillY[i] = pillY[pillCount]; pillT[i] = pillT[pillCount];
      } else i++;
    }

    // Effects decay
    if (baseHeat > 0) baseHeat = Math.max(0, baseHeat - dt * 3);
    if (bossHeat > 0) bossHeat = Math.max(0, bossHeat - dt * 3);
    if (ghostHP > baseHP) ghostHP += (baseHP - ghostHP) * Math.min(1, dt * 2.5);
    if (cannonFlash > 0) cannonFlash = Math.max(0, cannonFlash - dt * 3);
    for (gi = 0; gi < gateCount; gi++) if (gateFlash[gi] > 0) gateFlash[gi] = Math.max(0, gateFlash[gi] - dt * 4);
    for (i = 0; i < POP_MAX; i++) if (popLife[i] > 0) popLife[i] -= dt * 4;
  }

  // ---------- Rendering ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function fmt(n) { return n >= 1000 ? ((n / 1000) | 0) + ',' + ('00' + (n % 1000)).slice(-3) : '' + n; }

  function render() {
    var i;
    // Background
    ctx.fillStyle = '#0b1020';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#121a35';
    ctx.fillRect(10, BASE_BOTTOM, W - 20, H - BASE_BOTTOM);

    // HUD: level
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '800 16px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('LEVEL ' + level + ' / ' + MAX_LEVEL, 14, 26);
    if (isBossLevel) {
      ctx.fillStyle = '#ff6a78';
      ctx.font = '800 11px system-ui, sans-serif';
      ctx.fillText('BOSS', 14, 42);
    }
    if (powerLeft > 0) {
      ctx.fillStyle = '#ffd36a'; ctx.font = '800 13px system-ui, sans-serif'; ctx.textAlign = 'right';
      ctx.fillText(Armory[powerName].name.toUpperCase() + ' ' + powerLeft.toFixed(1) + 's', W - 14, 26);
      ctx.textAlign = 'left';
    }

    // Danger line at the cannon
    ctx.strokeStyle = 'rgba(255,70,90,0.35)';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(10, CANNON_Y); ctx.lineTo(W - 10, CANNON_Y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Opponent base. Damage flicker: strobes and shakes in proportion to the recent hit rate
    var heatMix = baseHeat * (0.5 + 0.5 * Math.sin(clock * 55));
    var shake = Math.sin(clock * 90) * baseHeat * 2;
    ctx.fillStyle = 'rgb(' + ((216 + 39 * heatMix) | 0) + ',' + ((58 + 80 * heatMix) | 0) + ',' + ((74 + 64 * heatMix) | 0) + ')';
    roundRect(10 + shake, BASE_Y, W - 20, BASE_H, 14);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '700 28px system-ui, sans-serif';
    ctx.textAlign = 'center';
    var showHP = isBossLevel ? bossHP : baseHP, showMax = isBossLevel ? bossMaxHP : baseMaxHP;
    ctx.fillText(isBossLevel ? 'BOSS ' + fmt(bossActive ? bossHP : bossMaxHP) : fmt(baseHP) + ' HP', W / 2 + shake, BASE_Y + BASE_H / 2 - 6);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(30, BASE_Y + BASE_H - 14, W - 60, 6);
    if (!isBossLevel) {
      ctx.fillStyle = '#ffe27a';                       // chip-damage trail
      ctx.fillRect(30, BASE_Y + BASE_H - 14, (W - 60) * (ghostHP / showMax), 6);
    }
    ctx.fillStyle = isBossLevel ? '#ff9a3c' : '#7dff9a';
    ctx.fillRect(30, BASE_Y + BASE_H - 14, (W - 60) * ((bossActive || !isBossLevel ? showHP : showMax) / showMax), 6);

    // Black holes (rotating swirl)
    for (i = 0; i < holeCount; i++) {
      ctx.strokeStyle = 'rgba(160,120,255,0.18)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(holeX[i], holeY[i], HOLE_R, 0, 6.2832); ctx.stroke();
      ctx.strokeStyle = 'rgba(190,150,255,0.8)';
      ctx.lineWidth = 2;
      for (var arm = 0; arm < 3; arm++) {
        var a0 = clock * 2.2 + arm * 2.0944;
        ctx.beginPath(); ctx.arc(holeX[i], holeY[i], 20, a0, a0 + 1.4); ctx.stroke();
      }
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(holeX[i], holeY[i], HOLE_CORE + 2, 0, 6.2832); ctx.fill();
    }
    // Pinball bumpers
    for (i = 0; i < bumpCount; i++) {
      ctx.fillStyle = '#7b8194';
      ctx.beginPath(); ctx.arc(bumpX[i], bumpY[i], bumpR[i], 0, 6.2832); ctx.fill();
      ctx.fillStyle = '#b4bacb';
      ctx.beginPath(); ctx.arc(bumpX[i] - bumpR[i] * 0.25, bumpY[i] - bumpR[i] * 0.25, bumpR[i] * 0.45, 0, 6.2832); ctx.fill();
    }

    // Gates
    ctx.font = '800 22px system-ui, sans-serif';
    for (var gi = 0; gi < gateCount; gi++) {
      var g = GATES[gi], f = gateFlash[gi];
      var isMul = g.type === 'x', isNeg = g.type === '-' || g.type === '/';
      ctx.fillStyle = isNeg ? 'rgba(255,70,90,' + (0.35 + f * 0.4) + ')'
                    : isMul ? 'rgba(60,160,255,' + (0.35 + f * 0.4) + ')' : 'rgba(90,230,140,' + (0.35 + f * 0.4) + ')';
      roundRect(g.x, g.y - g.h / 2, g.w, g.h, 8);
      ctx.fill();
      ctx.strokeStyle = isNeg ? '#ff4d5e' : isMul ? '#4db3ff' : '#6dffa6';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.fillText(g.label, g.x + g.w / 2, g.y + 1);
      if (g.type === '-') {                          // remaining tax charges
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillRect(g.x + 8, g.y + g.h / 2 - 4, (g.w - 16) * (g.charges / g.n), 2);
      }
    }

    // Terrain: solid gray slabs
    for (i = 0; i < terrainCount; i++) {
      ctx.save();
      ctx.translate(tCX[i], tCY[i]); ctx.rotate(Math.atan2(tSin[i], tCos[i]));
      ctx.fillStyle = '#5b6483'; ctx.fillRect(-tHW[i], -tHH[i], tHW[i] * 2, tHH[i] * 2);
      ctx.strokeStyle = '#9aa3c4'; ctx.lineWidth = 2; ctx.strokeRect(-tHW[i], -tHH[i], tHW[i] * 2, tHH[i] * 2);
      ctx.restore();
    }
    // Red pipe (or the boss hull) at the top
    if (!isBossLevel) { ctx.fillStyle = '#3a1020'; ctx.fillRect(pipeX - 10, BASE_BOTTOM - 4, 20, 10); ctx.fillStyle = '#ff4d5e'; ctx.fillRect(pipeX - 6, BASE_BOTTOM + 3, 12, 3); }

    // Supply crate and falling pills
    if (crateActive) {
      ctx.fillStyle = '#8b93ad'; roundRect(crateX - CRATE_R, crateY - CRATE_R * 0.8, CRATE_R * 2, CRATE_R * 1.6, 5); ctx.fill();
      ctx.strokeStyle = '#d8def5'; ctx.lineWidth = 2; roundRect(crateX - CRATE_R, crateY - CRATE_R * 0.8, CRATE_R * 2, CRATE_R * 1.6, 5); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = '800 12px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(String(crateHP), crateX, crateY + 1);
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(crateX - CRATE_R, crateY - CRATE_R - 6, CRATE_R * 2, 4);
      ctx.fillStyle = '#7dff9a'; ctx.fillRect(crateX - CRATE_R, crateY - CRATE_R - 6, CRATE_R * 2 * (crateHP / CRATE_HP), 4);
    }
    for (i = 0; i < pillCount; i++) {
      ctx.fillStyle = pillT[i] === 0 ? '#ffb02e' : '#b07dff';
      ctx.beginPath(); ctx.arc(pillX[i], pillY[i], 10, 0, 6.2832); ctx.fill();
      ctx.fillStyle = '#111'; ctx.font = '800 12px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(pillT[i] === 0 ? 'S' : 'P', pillX[i], pillY[i] + 1);
    }

    // Blue mobs: one batched path, one fill
    ctx.fillStyle = '#4db3ff';
    ctx.beginPath();
    for (i = 0; i < mobCount; i++) {
      ctx.moveTo(mx[i] + MOB_R, my[i]);
      ctx.arc(mx[i], my[i], MOB_R, 0, 6.2832);
    }
    ctx.fill();

    // Red mobs: per Bestiary type, healthy and wounded batches
    for (var ty = 0; ty < 3; ty++) {
      var rt = RT_LIST[ty], rr2 = RT_RAD[ty];
      for (var wd = 0; wd < 2; wd++) {
        ctx.fillStyle = wd ? rt.wound : rt.color;
        ctx.beginPath();
        for (i = 0; i < redCount; i++) {
          if (rtype[i] !== ty || (rhp[i] < RT_HP[ty]) !== (wd === 1)) continue;
          ctx.moveTo(rx[i] + rr2, ry[i]);
          ctx.arc(rx[i], ry[i], rr2, 0, 6.2832);
        }
        ctx.fill();
      }
    }

    // Boss (mothership): wide rounded hull
    if (bossActive) {
      var bh = bossHeat * (0.5 + 0.5 * Math.sin(clock * 60));
      var bx0 = bossX - BOSS_W / 2, by0 = bossY - BOSS_H / 2;
      ctx.fillStyle = 'rgb(' + ((150 + 105 * bh) | 0) + ',' + ((24 + 100 * bh) | 0) + ',' + ((40 + 80 * bh) | 0) + ')';
      roundRect(bx0, by0, BOSS_W, BOSS_H, 22); ctx.fill();
      ctx.strokeStyle = '#ff4d5e'; ctx.lineWidth = 3;
      roundRect(bx0, by0, BOSS_W, BOSS_H, 22); ctx.stroke();
      ctx.fillStyle = '#fff';                         // angry eyes
      ctx.beginPath(); ctx.arc(bossX - 26, bossY - 6, 7, 0, 6.2832); ctx.arc(bossX + 26, bossY - 6, 7, 0, 6.2832); ctx.fill();
      ctx.fillStyle = '#200';
      ctx.beginPath(); ctx.arc(bossX - 26, bossY - 4, 3.5, 0, 6.2832); ctx.arc(bossX + 26, bossY - 4, 3.5, 0, 6.2832); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '800 14px system-ui, sans-serif';
      ctx.fillText(fmt(bossHP), bossX, bossY + 17);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(bx0 + 10, by0 - 9, BOSS_W - 20, 5);
      ctx.fillStyle = '#ff9a3c';
      ctx.fillRect(bx0 + 10, by0 - 9, (BOSS_W - 20) * (bossHP / bossMaxHP), 5);
    }

    // Collision pops
    ctx.lineWidth = 2;
    for (i = 0; i < POP_MAX; i++) {
      var life = popLife[i];
      if (life <= 0) continue;
      ctx.strokeStyle = 'rgba(255,255,255,' + life.toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(popX[i], popY[i], 4 + (1 - life) * 16, 0, 6.2832);
      ctx.stroke();
    }

    // Cannon (flashes red when hit)
    ctx.fillStyle = cannonFlash > 0 ? '#ff6a78' : '#2b3a6b';
    roundRect(cannonX - 9, CANNON_Y - 26, 18, 30, 5);
    ctx.fill();
    ctx.fillStyle = cannonFlash > 0 ? '#ff4d5e' : '#4db3ff';
    ctx.beginPath();
    ctx.arc(cannonX, CANNON_Y + 6, 20, 0, 6.2832);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cannonX, CANNON_Y + 6, 7, 0, 6.2832);
    ctx.fill();

    // Cannon HP pips under the cannon
    var px0 = cannonX < 36 ? 36 : (cannonX > W - 36 ? W - 36 : cannonX);
    px0 -= (CANNON_MAX_HP - 1) * 6;
    for (i = 0; i < CANNON_MAX_HP; i++) {
      ctx.fillStyle = i < cannonHP ? '#ff6a78' : 'rgba(255,255,255,0.15)';
      ctx.beginPath();
      ctx.arc(px0 + i * 12, H - 9, 4, 0, 6.2832);
      ctx.fill();
    }

    // Screen flash when the cannon is hit
    if (cannonFlash > 0) {
      ctx.fillStyle = 'rgba(255,40,60,' + (cannonFlash * 0.28).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- Main loop ----------
  var last = 0;
  function frame(t) {
    var dt = (t - last) / 1000;
    last = t;
    if (dt > MAX_DT) dt = MAX_DT;
    if (dt > 0) update(dt);
    render();
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', function () { last = performance.now(); });

  // Debug/test hooks: only exposed at index.html#debug
  if (typeof location !== 'undefined' && location.hash === '#debug') {
    window.__mob = {
      update: update, reset: reset, gates: GATES, restart: onRestart, generateLevel: generateLevel,
      MAX_WAVE: MAX_WAVE,
      setLevel: function (n) { level = n; reset(); },
      setGates: function (defs) { gateCount = defs.length; for (var q = 0; q < defs.length; q++) cfgGate(GATES[q], defs[q]); },
      setObstacles: function (o) {
        setTerrain(o.terrain || []);
        bumpCount = (o.bumpers || []).length; holeCount = (o.holes || []).length;
        for (var q = 0; q < bumpCount; q++) { bumpX[q] = o.bumpers[q][0]; bumpY[q] = o.bumpers[q][1]; bumpR[q] = o.bumpers[q][2]; }
        for (q = 0; q < holeCount; q++) { holeX[q] = o.holes[q][0]; holeY[q] = o.holes[q][1]; }
      },
      get: function () {
        var sl = Array.prototype.slice;
        return { mobCount: mobCount, redCount: redCount, baseHP: baseHP, cannonHP: cannonHP, state: state,
                 level: level, gateCount: gateCount, bumpCount: bumpCount, holeCount: holeCount,
                 isBoss: isBossLevel, bossActive: bossActive, bossHP: bossHP, bossMaxHP: bossMaxHP, bossY: bossY, bossX: bossX,
                 capBlue: MAX_MOBS, capRed: MAX_RED,
                 redX: sl.call(rx, 0, redCount), redY: sl.call(ry, 0, redCount), redHP: sl.call(rhp, 0, redCount), redType: sl.call(rtype, 0, redCount),
                 waveQueue: waveQueue, crateTimer: crateTimer, pipeX: pipeX, terrainCount: terrainCount, crateActive: crateActive, crateX: crateX, crateY: crateY, crateHP: crateHP,
                 pillCount: pillCount, pillX: sl.call(pillX, 0, pillCount), pillY: sl.call(pillY, 0, pillCount), powerName: powerName, powerLeft: powerLeft,
                 blueVX: sl.call(mvx, 0, mobCount), blueVY: sl.call(mvy, 0, mobCount),
                 blueX: sl.call(mx, 0, mobCount), blueY: sl.call(my, 0, mobCount) };
      },
      aim: function (x) { targetX = x; cannonX = x; },
      touch: function (b) { dragging = !!b; },
      setBaseHP: function (n) { baseHP = n; ghostHP = n; },
      setBossHP: function (n) { bossHP = n; },
      spawnBoss: spawnBoss, calculateLevelMTM: calculateLevelMTM, tierOf: tierOf, levelThroughput: levelThroughput,
      Armory: Armory, RedMobTypes: RedMobTypes, equip: equip,
      RED_SPEED_CAP: RED_SPEED_CAP, CRATE_HP: CRATE_HP, POWER_TIME: POWER_TIME,
      setTerrain: setTerrain, spawnCrate: spawnCrate, spawnPill: function (x, y, t) { spawnPill(x, y); if (t !== undefined) pillT[pillCount - 1] = t; },
      setCrateTimer: function (t) { crateTimer = t; }, queueWave: queueWave,
      // Dry-run of one blue launched at x0 (terrain only): returns {x: [...], t: [...]} where it crosses each y in ys (bots use this to aim round terrain)
      traceBlue: function (x0, ys) {
        var x = x0, y = CANNON_Y - 18, vx = 0, vy = -MOB_SPEED, ox = [], ot = [], k = 0, bumped = false, dt = 1 / 60;
        for (var st = 0; st < 900 && k < ys.length; st++) {
          x += vx * dt; y += vy * dt;
          if (x < MOB_R) { x = MOB_R; vx = -vx; } else if (x > W - MOB_R) { x = W - MOB_R; vx = -vx; }
          if (terrainCount && terrainResolve(x, y, MOB_R)) {
            x = pX; y = pY;
            var tn = vx * thNX + vy * thNY; if (tn < 0) { vx -= tn * thNX; vy -= tn * thNY; }
            var tt = vx * thTX + vy * thTY; if (tt > -SLIDE_MIN && tt < SLIDE_MIN) { vx += thTX * (SLIDE_MIN - tt); vy += thTY * (SLIDE_MIN - tt); }
            bumped = true;
          }
          if (bumped) vy += (-MOB_SPEED - vy) * Math.min(1, dt * 3);
          vx *= (1 - Math.min(1, dt * 2.5));
          while (k < ys.length && y <= ys[k]) { ox.push(x); ot.push((st + 1) * dt); k++; }
        }
        while (k < ys.length) { ox.push(x); ot.push(99); k++; }
        return { x: ox, t: ot };
      },
      setBossSpeed: function (pxPerSec) { bossSpeed = pxPerSec; },
      spawnBlue: function (x, y, vx, vy, mask) { return spawnMob(x, y, vx, vy, mask || 0); },
      spawnRed: spawnRed,
      setFlags: function (f) { if ('fire' in f) autoFire = f.fire; if ('spawner' in f) spawnerOn = f.spawner; }
    };
  }

  syncMuteBtn();
  resize();
  reset();
  requestAnimationFrame(function (t) { last = t; requestAnimationFrame(frame); });
})();
</script>
